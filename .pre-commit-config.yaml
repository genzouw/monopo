repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (^|/)(package\.json|bun\.lockb?|package-lock\.json)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [commit]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.95.9
    hooks:
      - id: trufflehog
        stages: [commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: Prevent committing sensitive files and AI workspaces
        entry: '❌ Error: Attempted to commit banned sensitive files or AI workspaces. Please remove them from your commit (e.g., git reset HEAD <file>).'
        language: fail
        files: '(?i)(\.env$|\.env\..*|.*\.pem$|.*\.key$|id_rsa$|id_ed25519$|id_ecdsa$|id_dsa$|.*credentials.*\.(json|ya?ml|env)$|.*secret.*\.(json|ya?ml|env)$|\.npmrc$|\.netrc$|.*\.(p12|pfx|keystore|sqlite|sqlite3|db)$|service-?account.*\.(json|ya?ml|env)$|\.tfstate.*|(^|/)\.history/|(^|/)\.copilot/|(^|/)\.cursor/|(^|/)\.claude/|(^|/)\.aider[^/]*|(^|/)\.continue/|(^|/)\.jules/|(^|/)\.cline/|(^|/)\.windsurf/|(^|/)\.trae/|(^|/)\.roo/|.*\.log$|.*-report\.md$|ai-report-.*\.md$|(^|/)[^/]*\.patch$|(^|/)[^/]*\.diff$)'
        exclude: '\.env\.example$'
