repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        # 既定の --fix=auto は「1ファイル内でLF/CRLFが混在し、かつCRLFが多数派」の場合に
        # CRLF側へ書き換えてしまい、.editorconfig の end_of_line=lf や Prettier の
        # 既定 endOfLine=lf と矛盾する。また全行CRLFのファイルは「混在」ではないため
        # 無検知で通過してしまう。--fix=lf を明示し、常にLFへ統一する。
        args: ['--fix=lf']
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (^|/)(package\.json|bun\.lockb?|package-lock\.json)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [commit]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.97.0
    hooks:
      - id: trufflehog
        stages: [commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # actionlint-docker を使用することで、内部に同梱された shellcheck や pyflakes が
      # 利用可能になり、run: ブロックのインジェクション・構文エラーの検知が有効になります。
      # entry を digest 固定することで、tag が指す実体を差し替えられても
      # 意図しないイメージを実行しないようにしています（CWE-494: 整合性チェックなしのコード取得対策）。
      # digest は docker.io/rhysd/actionlint:1.7.12 に対応するもの。
      # 将来 rev（フック定義）を更新する際は、対応する digest も併せて更新してください。
      - id: actionlint-docker
        entry: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  # 旧名 woodruffw/zizmor-pre-commit は zizmorcore/zizmor-pre-commit にリネーム済み。
  # 旧名は 301 リダイレクトで解決するが、旧名で誰かが新規リポジトリを作成した時点で
  # リダイレクトは失われるため、正規名で参照する。
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      # --offline を明示し、実行モードを環境非依存に固定する。
      # zizmor は GH_TOKEN / GITHUB_TOKEN / ZIZMOR_GITHUB_TOKEN のいずれかが
      # 環境変数にあると自動でオンラインモードへ切り替わり、ref-version-mismatch 等の
      # 追加検知で非 0 終了する。結果として「トークンを export している開発者だけ
      # コミットできない」状態になり、回避のための --no-verify が gitleaks 等
      # すべてのフックを無効化してしまうため、ローカルはオフラインに固定する。
      # オンライン検査は GH_TOKEN 付きで動く .github/workflows/zizmor.yml が担当する。
      # なお args を指定するとフック定義側のデフォルト（--no-progress）が
      # 置き換わるため、両方を明示する必要がある。
      - id: zizmor
        args: ['--no-progress', '--offline']

  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: Prevent committing sensitive files and AI workspaces
        entry: '❌ Error: Attempted to commit banned sensitive files or AI workspaces. Please remove them from your commit (e.g., git reset HEAD <file>).'
        language: fail
        files: '(?i)(\.env$|\.env\..*|.*\.pem$|.*\.key$|id_rsa$|id_ed25519$|id_ecdsa$|id_dsa$|.*credentials.*\.(json|ya?ml|env)$|.*secret.*\.(json|ya?ml|env)$|\.npmrc$|\.netrc$|.*\.(p12|pfx|keystore|sqlite|sqlite3|db)$|service-?account.*\.(json|ya?ml|env)$|\.tfstate.*|(^|/)\.vercel/|(^|/)\.netlify/|(^|/)\.wrangler/|(^|/)\.serverless/|(^|/)\.sst/|(^|/)\.envrc$|(^|/)\.history/|(^|/)\.copilot/|(^|/)\.cursor/|(^|/)\.claude/|(^|/)\.aider[^/]*|(^|/)\.continue/|(^|/)\.jules/|(^|/)\.cline/|(^|/)\.windsurf/|(^|/)\.trae/|(^|/)\.roo/|(^|/)\.cascade/|.*\.log$|.*-report\.md$|ai-report-.*\.md$|(^|/)[^/]*\.patch$|(^|/)[^/]*\.diff$)'
        exclude: '\.env\.example$|^\.secretlintrc\.json$|^\.github/workflows/secretlint\.yml$'
