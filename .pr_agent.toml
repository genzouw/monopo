[config]
response_language="ja-JP"

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = true
pr_commands = ["/review", "/describe", "/improve"]
pr_actions = ["opened", "reopened", "ready_for_review", "synchronize"]

[pr_similar_issue]
skip_comments = false
force_update_dataset = false
max_issues_to_scan = 500
vectordb = "pinecone"

[auto_best_practices]
enable_auto_best_practices = true

[pr_reviewer]
require_can_be_split_review = true
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
extra_instructions = """
- UIテキスト、ドキュメント、コメントはすべて日本語で記述してください。
- プロジェクト全体で「monopoly（モノポリ）」ではなく必ず「monopo（モノポ）」という名称を使用してください。
- パッケージマネージャとして npm / yarn / pnpm ではなく、必ず Bun を使用してください。
- セキュアな乱数生成には `Math.random()` ではなく `src/game/random.ts` の `getSecureRandom` または `getSecureRandomInt` を使用しているか確認してください。
- ボタン要素には生HTMLの `<button>` ではなく、必ず共通コンポーネントである `<Button>` (`src/components/common/Button.tsx`) を使用しているか確認してください。
- LLM/AIツールの連携時はプロンプトインジェクションやデータ漏洩等のAI特有のセキュリティリスクを考慮し、ドキュメントの整合性を確認してください。最新のAI推論モデル(最新のAI CI/CDトレンド)によって自動生成されたコードが含まれる場合も、同様にセキュリティ上の脆弱性（プロンプトインジェクション等）や過度な複雑化がないか厳格にレビューしてください。
- フロントエンドの変更においては、WCAG に準拠したアクセシビリティ (A11y) と UI/UX のベストプラクティスが考慮されているか確認してください。
- 新たなAIツールやサービスの導入を提案・レビューする際は、公開リポジトリにおける無料枠の適用条件、使用量・レート上限、超過時に自動課金されないことを必ず確認してください。支払い情報の登録が必要なサービスの場合は、その旨をPRに明示することもあわせて必須とします。さらに、最新のCI/CDトレンドに基づくベストプラクティスが考慮されているか確認してください。また、導入前に秘密情報漏洩・プロンプトインジェクション・その他のインジェクション脆弱性について、ローカルチェックと自動レビューツールによる多層検証が行われているか確認してください。
- AIが生成したコードや改善提案を取り入れる際は、必ずローカルでのテスト実行と目視によるレビューを行うよう、PR作成者に促すコメントを含めてください。
- 変更されたコンポーネント（関数・クラス・モジュール）がプロジェクトのアーキテクチャ（ディレクトリ構成、責務分割、依存の向き）と整合しているかを分析し、逸脱があれば具体的に指摘してください。
"""

[pr_description]
enable_pr_diagram = true
publish_labels = true
add_original_user_description = true
generate_ai_title = true
use_description_markers = true

[pr_code_suggestions]
num_code_suggestions = 4
focus_only_on_problems = true

[pr_custom_prompt]
prompt = """
最新の AI CI/CD のベストプラクティスに基づき、このPRのコードをレビューしてください。特にパフォーマンスの最適化やBunの機能活用、React 19のパターンに注目し、日本語で出力してください。
"""
