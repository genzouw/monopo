[pr_reviewer]
extra_instructions = """
- UIテキスト、ドキュメント、コメントはすべて日本語で記述してください。
- プロジェクト全体で「monopoly（モノポリ）」ではなく必ず「monopo（モノポ）」という名称を使用してください。
- パッケージマネージャとして npm / yarn / pnpm ではなく、必ず Bun を使用してください。
- セキュアな乱数生成には `Math.random()` ではなく `src/game/random.ts` の `getSecureRandom` または `getSecureRandomInt` を使用しているか確認してください。
- ボタン要素には生HTMLの `<button>` ではなく、必ず共通コンポーネントである `<Button>` (`src/components/common/Button.tsx`) を使用しているか確認してください。
- 最新のAI推論モデル(最新のAI CI/CDトレンド)によって自動生成されたコードが含まれる場合、セキュリティ上の脆弱性（プロンプトインジェクション等）や過度な複雑化がないか厳格にレビューしてください。
- フロントエンドの変更においては、WCAG に準拠したアクセシビリティ (A11y) と UI/UX のベストプラクティスが考慮されているか確認してください。
- 新たなAIツールやサービスの導入を提案・レビューする際は、公開リポジトリにおいて無料で利用可能であることを必ず確認してください。
"""

[pr_description]
extra_instructions = """
- PRの説明はすべて日本語で記述してください。
"""
[pr_code_suggestions]
extra_instructions = """
- コードの改善提案はすべて日本語で記述してください。
"""
[pr_add_docs]
extra_instructions = """
- 生成されるドキュメントやコメントはすべて日本語で記述してください。
"""

[pr_update_changelog]
extra_instructions = """
- Changelogの更新はすべて日本語で記述してください。
"""

[pr_analyze]
extra_instructions = """
- アーキテクチャの分析とセキュリティリスクの検証を含め、すべて日本語で報告してください。
"""

[pr_custom_prompt]
prompt = """
最新の AI CI/CD のベストプラクティスに基づき、このPRのコードをレビューしてください。特にパフォーマンスの最適化やBunの機能活用、React 19のパターンに注目し、日本語で出力してください。
"""
