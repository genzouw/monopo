# Sweep AI configuration
# Sweep reads this file to understand your project's guidelines and settings.

# By default Sweep will read the logs and failing tests to fix bugs.
# This will only be run if you have tests configured.
gha_enabled: true

# Sweep will read the codebase and find the best place to add the new code.
# You can override this by adding a "path" in the issue.
branch: 'sweep'

# Sweep reads these rules and applies them to all code changes.
rules:
  - 'All UI texts, documentation, and comments must be written in Japanese.'
  - "Always use the term 'monopo' (モノポ) instead of 'monopoly' (モノポリ) for trademark reasons."
  - 'Use Bun as the package manager. Do not use npm, yarn, or pnpm.'
  - 'Ensure safe random number generation using getSecureRandomInt from src/game/random.ts instead of Math.random().'
  - 'Provide appropriate JSDoc comments for new or modified functions and components.'
  - 'When modifying React components, ensure appropriate accessibility (A11y/WCAG) attributes are added.'

# Set the PR title and description to Japanese language
description: 'Sweepが自動生成したプルリクエストです。'
