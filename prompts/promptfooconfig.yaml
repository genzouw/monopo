description: 'Sample prompt evaluation'
providers:
  - id: 'github:openai/o3-mini'
    config:
      apiKey: 'envar:GH_MODELS_TOKEN' # pragma: allowlist secret
tests:
  - description: 'パッケージマネージャーの規約に沿って Bun を回答すること'
    assert:
      - type: icontains
        value: 'Bun'
  - description: '応答が空でないこと'
    assert:
      - type: javascript
        value: 'output.trim().length > 0'
