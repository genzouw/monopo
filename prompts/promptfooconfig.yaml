description: 'Sample prompt evaluation'
# promptfoo-action の `prompts` 入力はPR内で変更されたファイルのみを検出するため、
# sample-prompt.json 自体が変更されないPR（本ファイルのみの変更等）では検出されず、
# デフォルトの {{prompt}} テンプレート（空文字列）にフォールバックしてしまう。
# config側で明示的に prompts を指定し、変更差分に依存せず常に評価対象を固定する。
prompts:
  - file://sample-prompt.json
providers:
  # GitHub Models は2026-07-30に退役したため、他のワークフロー（local-ai-pr-description.yml等）と
  # 同様に、リポジトリ内で完結する無料のローカルLLM (Ollama) へ移行（Refs #573）。
  # APIキー不要。ワークフロー側で `ai-action/setup-ollama` によりホストしたサーバーに接続する。
  - id: 'ollama:chat:deepseek-r1:1.5b'
    # モデルは .github/workflows/ai-prompt-evaluator.yml の `ollama pull` と
    # .github/actions/ollama-generate/action.yml の既定値と揃えること（二重管理のため）。
    # temperature未指定だと極小モデル（1.5b）の出力がサンプリングにより揺れ、
    # 「Bun」以外（yarn等）を回答してCIがflakyに失敗することがあるため0に固定する。
    # R1 は推論過程（<think>）込みで出力するため、Bun の判定は <think> を除いた最終回答に対して行う。
    config:
      temperature: 0
tests:
  - description: 'パッケージマネージャーの規約に沿って Bun を回答すること'
    assert:
      # icontains は output 全体を検査するため、<think> 内の「Bun」で誤って成功しないよう、
      # 閉じタグの有無を問わず <think> を除去した最終回答に対して大文字小文字を区別せず判定する。
      - type: javascript
        value: 'String(output).replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/<think>[\s\S]*$/i, "").toLowerCase().includes("bun")'
  - description: '応答が空でないこと'
    assert:
      - type: javascript
        value: 'output.trim().length > 0'

# redteam（LLM脆弱性診断）は設けない。
# monopo 本体（ボードゲームWebアプリ）はランタイムで LLM を一切呼ばず、
# 評価対象の sample-prompt.json も CI 疎通確認用でユーザー入力を受け取らないため、
# 診断すべき攻撃面がアプリ側に存在しない。
# CI 上の LLM 利用（.github/workflows/local-ai-*.yml）のインジェクション対策は Refs #642。
