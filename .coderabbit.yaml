# CodeRabbit configuration
# https://docs.coderabbit.ai/reference/configuration

language: ja-JP
tone_instructions: 'すべての投稿、コメント、レビューは必ず日本語で行ってください。セキュリティ、パフォーマンス、可読性、設計の妥当性に加え、命名規則、マジックナンバー、将来のリファクタリングを見据えた設計改善など、細部まで厳格に評価し、具体的な改善案を提案してください。'
early_access: false
enable_free_tier: true

reviews:
  # レビュー観点を厳しめに設定するため "assertive" に設定。
  profile: assertive

  # CodeRabbit を bot reviewer として動作させる。
  # 問題なしと判断した PR に対して Approve ステータスを返す。
  # 個人運営での self-merge 運用 (PR 作成者は自分の PR を承認できない GitHub 仕様)
  # を補助する目的で有効化。Approve は最終判断ではなく補助。
  request_changes_workflow: true

  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - main

  # 生成物 / 依存物 / ロックファイルなどはレビュー対象から除外する。
  path_filters:
    - '!dist/**'
    - '!coverage/**'
    - '!node_modules/**'
    - '!pnpm-lock.yaml'
    - '!package-lock.json'
    - '!yarn.lock'
    - '!**/*.min.js'
    - '!**/*.min.css'
    - '!**/*.map'
    - '!**/*.snap'

  abort_on_close: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
