version: 1
engines:
  format: true
  lint: true
  code-quality: true
  ai-slop: true
  architecture: true
  security: true
quality:
  maxFunctionLoc: 80
  maxFileLoc: 400
  maxNesting: 5
  maxParams: 6
lint:
  typecheck: true
  expoDoctor: false
security:
  audit: true
  auditTimeout: 25000
# 依存パッケージの脆弱性検出は warning として出力に残し、ゲートの即失敗要因にはしない。
# 修正版が未公開のアドバイザリが出ると、差分と無関係に main と全 PR が失敗し続けるため。
# 検出結果は OSV-Scanner が Security タブ (code scanning alerts) に記録する。
# OSV-Scanner / Trivy は失敗しない設定のため、新しいアドバイザリで CI が失敗する経路は無い。
# 修正版が公開されたら Renovate が更新 PR を出す。
rules:
  security/vulnerable-dependency: warning
scoring:
  weights:
    format: 0.3
    lint: 0.6
    code-quality: 0.8
    ai-slop: 1
    architecture: 1
    security: 1.5
  thresholds:
    good: 75
    ok: 50
  smoothing: 5
  maxPerRule: 40
ci:
  failBelow: 70
  format: json
telemetry:
  enabled: false
