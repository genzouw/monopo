name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch PR Diff
        id: fetch-diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });
            // 差分が大きすぎる場合は制限する
            const truncatedDiff = diff.data.slice(0, 10000);
            return truncatedDiff;

      - name: Generate AI Code Review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          PR_DIFF: ${{ steps.fetch-diff.outputs.result }}
        with:
          script: |
            const prDiff = process.env.PR_DIFF;
            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のプルリクエストの差分をレビューし、コードの品質、潜在的なバグ、セキュリティの問題、パフォーマンスの改善点（React 19の最新機能やBunの最適化を含む）、およびAIコンテキストの境界違反がないかについて日本語で簡潔にフィードバックを提供してください。プロジェクト要件: 名称には「monopoly」ではなく必ず「monopo」を使用する。パッケージマネージャには必ずBunを使用する。差分:\n\n${prDiff}`;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            if (!aiRes.ok) {
              console.log('AI Review failed');
              return;
            }
            const aiData = await aiRes.json();
            const review = aiData.choices?.[0]?.message?.content;

            if (review) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 AI Code Review\n\n${review}`
              });
            }
