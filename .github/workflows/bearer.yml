name: Bearer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: bearer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rule_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Report
        id: report
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          format: sarif
          output: results.sarif
      - name: Normalize SARIF results field
        if: always()
        # bearer は検知0件のとき results を null で出力し、SARIFスキーマ違反（配列必須）でアップロードが失敗するため、
        # 欠落時のみ空配列を補う（既存の検知結果がある場合は変更しない）。
        run: jq '.runs[] |= (.results //= [])' results.sarif > results.sarif.tmp && mv results.sarif.tmp results.sarif
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: bearer
