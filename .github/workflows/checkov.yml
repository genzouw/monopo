name: Checkov Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: checkov-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: .
          framework: github_actions,secrets
          output_format: cli,sarif
          output_file_path: console,results.sarif
          quiet: true
          # 検知した場合に CI を失敗させる（マージのブロックには branch protection の required status checks への登録が別途必要）。結果は SARIF 経由で Security タブにも集約する。
          soft_fail: false
      # Checkov 自体が異常終了して results.sarif が無いときは、アップロードの二次エラーで
      # 原因が埋もれないようスキップする（Checkov ステップの失敗でジョブは赤のまま残す）
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: checkov
