name: Checkov Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: checkov-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@29be5868bfa968f099ae80169f61f42887494b8f # v12.3133.0
        with:
          directory: .
          framework: github_actions,secrets
          output_format: cli,sarif
          output_file_path: console,results.sarif
          quiet: true
          # 検知した場合に CI を失敗させる（マージのブロックには branch protection の required status checks への登録が別途必要）。結果は SARIF 経由で Security タブにも集約する。
          soft_fail: false
      # Checkov 自体が異常終了して results.sarif が無いときは、アップロードの二次エラーで
      # 原因が埋もれないようスキップする（Checkov ステップの失敗でジョブは赤のまま残す）
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: checkov
