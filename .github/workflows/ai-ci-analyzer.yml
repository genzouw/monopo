name: AI CI Failure Analyzer

on:
  # zizmor: ignore[dangerous-triggers]
  # CI 完了後に失敗を解析してコメントする本ワークフローの根幹トリガー。
  # ジョブは権限を actions:read / pull-requests:write / contents:read に限定し、
  # PR のコード checkout やビルドは行わず、ログ閲覧とコメント投稿のみに留めるため安全。
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  analyze-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Analyze CI Failure and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const run_id = context.payload.workflow_run.id;

            // Try to get PR from workflow_run payload first (works for PR events)
            let pr = context.payload.workflow_run.pull_requests?.find(pr => pr.state === 'open');

            // Fallback to commit-based lookup if not found (works for push events)
            if (!pr) {
              const head_sha = context.payload.workflow_run.head_sha;
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: head_sha,
              });
              pr = pullRequests.find(pr => pr.state === 'open');
            }

            if (!pr) {
              console.log('No open PR found for this workflow run. Exiting.');
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id,
            });

            const failedJobs = jobs.jobs.filter(job => job.conclusion === 'failure');
            if (failedJobs.length === 0) {
              console.log('No failed jobs found.');
              return;
            }

            let logSnippet = '';
            for (const job of failedJobs) {
              try {
                const { data: logData } = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                const logStr = logData.toString();
                logSnippet += `\n--- Job: ${job.name} ---\n` + logStr.slice(-2000);
              } catch (e) {
                console.log(`Could not fetch log for job ${job.name}`, e);
              }
            }

            if (!logSnippet) {
              console.log('Could not retrieve logs for analysis.');
              return;
            }

            const query = `CI error fix: ${failedJobs.map(j => j.name).join(' ')} ${logSnippet.slice(-200).replace(/\n/g, ' ')}`;
            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: query.slice(0, 400),
                search_depth: 'advanced',
                include_answer: true,
              }),
            });

            let searchAnswer = '検索結果の要約なし';
            if (tavilyRes.ok) {
              try {
                const searchData = await tavilyRes.json();
                searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
              } catch (e) {
                console.log('Failed to parse Tavily response');
              }
            }

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のCI失敗ログとWeb検索結果を分析し、エラーの根本原因と具体的な修正案を日本語で提示してください。
            プロジェクトではパッケージマネージャにBunを使用し、名称には「monopoly」ではなく「monopo」を使用しています。
            簡潔にマークダウン形式で回答してください。

            Web検索によるヒント:
            ${searchAnswer}

            ログ:
            ${logSnippet}`;

            // GitHub Models (公開リポジトリで無料・OpenAI互換API)
            // GH_MODELS_TOKEN で認証
            const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            if (!response.ok) {
              const errorBody = await response.text().catch(() => '<failed to read body>');
              console.log(`GitHub Models API error: ${response.status} ${response.statusText}`);
              console.log('Response body:', errorBody);
              return;
            }

            const data = await response.json();
            const analysis = data.choices?.[0]?.message?.content;

            if (!analysis) {
              console.log('No analysis returned from GitHub Models.', JSON.stringify(data));
              return;
            }

            const body = `### 🤖 AI CI エラー分析\n\n${analysis}`;

            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
