name: AI Tool & Configuration Evaluator

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/**'
      - '**.config.*'
      - '.coderabbit.yaml'
      - '.pr-agent.toml'
      - 'docs/ai-guidelines.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.github/copilot-instructions.md'
      - 'sweep.yaml'

permissions:
  contents: read

jobs:
  evaluate-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze Tool Changes and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # pragma: allowlist secret
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            // CLAUDE.md 最重要原則: 従量課金の検索API（Tavily）をCI/CDに組み込むことは禁止されているため、Web検索は無効化しています。
            const searchContext = '検索結果なし（Web検索はコスト方針により無効化されています）';

            const prompt = `あなたは熟練のDevOpsエンジニアおよびAIツールスペシャリストです。
            以下のPRの差分（ツールの追加や設定変更）と、最新のAIツールのベストプラクティス（Web検索結果）をもとに、導入品質やセキュリティリスク、OSSでの無料枠の有無についての評価を日本語で提供してください。

            【検索結果】
            ${searchContext.slice(0, 3000)}

            【PR差分】
            ${diff.data.slice(0, 3000)}
            `;

            let aiRes;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 15000
                })
              });
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
              return;
            }

            if (!aiRes.ok) {
              const errBody = await aiRes.text().catch(() => '');
              core.warning(`AI ツール評価に失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              return;
            }

            let aiData;
            try {
              aiData = await aiRes.json();
            } catch (e) {
              core.warning(`GitHub Models の応答が不正な JSON でした: ${String(e)}`);
              return;
            }
            const choice = aiData.choices?.[0];
            const evaluation = choice?.message?.content;
            if (!evaluation) {
              // gpt-4o-mini は非推論モデルのため、content 空は出力トークン上限か空レスポンスを示す。
              // finish_reason で原因を判別し、警告メッセージを出し分ける。
              const emptyReason = choice?.finish_reason === 'length'
                ? '出力トークン上限に達した可能性があります'
                : '空レスポンスが返されました';
              core.warning(`GitHub Models から分析結果が返されませんでした (finish_reason: ${choice?.finish_reason ?? 'unknown'})。${emptyReason}。`);
              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 AI 自動ツール＆設定評価\n\n${evaluation}`
            });
