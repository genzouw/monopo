name: AI Tool & Configuration Evaluator

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/**'
      - '**.config.*'
      - '.coderabbit.yaml'
      - '.pr-agent.toml'
      - 'docs/ai-guidelines.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.github/copilot-instructions.md'
      - 'sweep.yaml'

permissions:
  contents: read

jobs:
  evaluate-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Analyze Tool Changes and Comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # pragma: allowlist secret
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.TAVILY_API_KEY}`
              },
              body: JSON.stringify({
                query: "2025 latest AI coding tools automated PR review free open source best practices security",
                search_depth: 'advanced'
              })
            });

            let searchContext = '検索に失敗しました';
            if (tavilyRes.ok) {
              const searchData = await tavilyRes.json();
              searchContext = searchData.results?.map(r => r.content).join('\n') || '';
            }

            const prompt = `あなたは熟練のDevOpsエンジニアおよびAIツールスペシャリストです。
            以下のPRの差分（ツールの追加や設定変更）と、最新のAIツールのベストプラクティス（Web検索結果）をもとに、導入品質やセキュリティリスク、OSSでの無料枠の有無についての評価を日本語で提供してください。

            【検索結果】
            ${searchContext.slice(0, 3000)}

            【PR差分】
            ${diff.data.slice(0, 3000)}
            `;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                reasoning_effort: 'high',
                max_completion_tokens: 15000,
                messages: [{ role: 'user', content: prompt }]
              })
            });

            if (aiRes.ok) {
              const aiData = await aiRes.json();
              const evaluation = aiData.choices?.[0]?.message?.content;
              if (evaluation) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `### 🤖 AI 自動ツール＆設定評価\n\n${evaluation}`
                });
              }
            }
