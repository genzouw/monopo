name: AI Tool & Configuration Evaluator

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/**'
      - '**.config.*'
      - '.coderabbit.yaml'
      - '.pr-agent.toml'
      - 'docs/ai-guidelines.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.github/copilot-instructions.md'
      - 'sweep.yaml'

permissions:
  contents: read

jobs:
  evaluate-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze Tool Changes and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # pragma: allowlist secret
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            let searchContext = '検索に失敗しました';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {})
                },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: "2025 latest AI coding tools automated PR review free open source best practices security",
                  search_depth: 'basic'
                })
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchContext = searchData.results?.map(r => r.content).join('\n') || '';
              }
            } catch (e) {
              core.warning(`Tavily 検索に失敗しました: ${String(e)}`);
            }

            const prompt = `あなたは熟練のDevOpsエンジニアおよびAIツールスペシャリストです。
            以下のPRの差分（ツールの追加や設定変更）と、最新のAIツールのベストプラクティス（Web検索結果）をもとに、導入品質やセキュリティリスク、OSSでの無料枠の有無についての評価を日本語で提供してください。

            【検索結果】
            ${searchContext.slice(0, 3000)}

            【PR差分】
            ${diff.data.slice(0, 3000)}
            `;

            let aiRes;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'openai/o3-mini',
                  messages: [{ role: 'user', content: prompt }],
                  reasoning_effort: 'high',
                  max_completion_tokens: 15000
                })
              });
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
              return;
            }

            if (!aiRes.ok) {
              const errBody = await aiRes.text().catch(() => '');
              core.warning(`AI ツール評価に失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              return;
            }

            let aiData;
            try {
              aiData = await aiRes.json();
            } catch (e) {
              core.warning(`GitHub Models の応答が不正な JSON でした: ${String(e)}`);
              return;
            }
            const evaluation = aiData.choices?.[0]?.message?.content;
            if (!evaluation) {
              // content 空は推論トークンが max_completion_tokens を使い切ったサイン。
              core.warning(`GitHub Models から分析結果が返されませんでした。${JSON.stringify(aiData).slice(0, 500)}`);
              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 AI 自動ツール＆設定評価\n\n${evaluation}`
            });
