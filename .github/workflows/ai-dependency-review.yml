name: AI Dependency Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Analyze Dependabot PR with Tavily
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No PR payload found.');
              return;
            }

            const title = pr.title;
            const body = (pr.body || '').substring(0, 3000);
            const prNumber = pr.number;

            // 1. Tavily Search for breaking changes or release notes
            let searchAnswer = '検索結果の要約なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {}) },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: `breaking changes or release notes for: ${title}`,
                  search_depth: 'basic',
                  include_answer: true,
                }),
              });

              if (tavilyRes.ok) {
                try {
                  const searchData = await tavilyRes.json();
                  searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
                } catch (e) {
                  console.log('Failed to parse Tavily response');
                }
              }
            } catch (e) {
              console.warn('Tavily search failed:', String(e));
            }

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のDependabotによる依存関係更新のプルリクエストとWeb検索結果を分析し、更新内容の要約と、潜在的な破壊的変更やリスク、確認すべきポイントを日本語で提示してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            PRタイトル: ${title}
            PR本文: ${body}
            Web検索によるリリースノートや破壊的変更のヒント: ${searchAnswer}`;

            // GitHub Models (公開リポジトリで無料・OpenAI互換API)
            let response;
            try {
              response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'o3-mini',
                  messages: [{ role: 'user', content: prompt }],
                  reasoning_effort: 'high',
                  max_completion_tokens: 15000
                })
              });
            } catch (e) {
              console.warn('GitHub Models request failed:', String(e));
              return;
            }

            if (!response.ok) {
              const errorBody = await response.text().catch(() => '<failed to read body>');
              console.log(`GitHub Models API error: ${response.status} ${response.statusText}`);
              console.log('Response body:', errorBody);
              return;
            }

            const data = await response.json();
            const analysis = data.choices?.[0]?.message?.content;

            if (!analysis) {
              console.log('No analysis returned from GitHub Models.', JSON.stringify(data));
              return;
            }

            const commentBody = `### 🤖 AI 依存関係レビュー\n\n${analysis}`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
