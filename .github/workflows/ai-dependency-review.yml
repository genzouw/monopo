name: AI Dependency Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Analyze Dependabot PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No PR payload found.');
              return;
            }

            const title = pr.title;
            const body = (pr.body || '').substring(0, 3000);
            const prNumber = pr.number;

            // CLAUDE.md 最重要原則: 従量課金の検索API（Tavily）をCI/CDに組み込むことは禁止されているため、Web検索は無効化しています。
            const searchAnswer = '検索結果の要約なし（Web検索はコスト方針により無効化されています）';

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のDependabotによる依存関係更新のプルリクエストとWeb検索結果を分析し、更新内容の要約と、潜在的な破壊的変更やリスク、確認すべきポイントを日本語で提示してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            PRタイトル: ${title}
            PR本文: ${body}
            Web検索によるリリースノートや破壊的変更のヒント: ${searchAnswer}`;

            // GitHub Models (公開リポジトリで無料・OpenAI互換API)
            let response;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 15000
                })
              });
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
              return;
            }

            if (!response.ok) {
              const errorBody = await response.text().catch(() => '<failed to read body>');
              core.warning(`GitHub Models API エラー: ${response.status} ${response.statusText} ${String(errorBody).slice(0, 500)}`);
              return;
            }

            let data;
            try {
              data = await response.json();
            } catch (e) {
              core.warning(`GitHub Models の応答が不正な JSON でした: ${String(e)}`);
              return;
            }
            const analysis = data.choices?.[0]?.message?.content;

            if (!analysis) {
              core.warning(`GitHub Models から分析結果が返されませんでした。${JSON.stringify(data).slice(0, 500)}`);
              return;
            }

            const commentBody = `### 🤖 AI 依存関係レビュー\n\n${analysis}`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
