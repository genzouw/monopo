name: AI Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Tavily Search and AI Label Proposal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, 4000);

            // 1. Tavily Search
            let searchAnswer = '検索結果の要約なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {}) },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: `2025 latest Issue triage context for: ${title}`,
                  search_depth: 'basic',
                  include_answer: true,
                }),
              });

              if (tavilyRes.ok) {
                try {
                  const searchData = await tavilyRes.json();
                  searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
                } catch (e) {
                  console.log('Failed to parse Tavily response');
                }
              }
            } catch (e) {
              console.warn('Tavily search failed:', String(e));
            }

            const prompt = `あなたは熟練のプロジェクトマネージャーです。以下のIssueの内容とWeb検索によるコンテキストをもとに、このIssueに付与すべき適切なラベル（bug, enhancement, question, request ai review, request ai tests など）を分析してください。
            出力は以下のJSON形式のみとしてください。Markdown修飾（\`\`\`json など）は絶対に含めないでください。
            { "label": "提案するラベル", "reason": "提案理由(日本語で記述)" }

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            検索結果の要約: ${searchAnswer}`;

            let analysis = 'ラベルの提案に失敗しました。';
            let parsedResult = null;
            try {
              const aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'openai/o3-mini',
                  messages: [{ role: 'user', content: prompt }],
                  reasoning_effort: 'high',
                  max_completion_tokens: 15000
                })
              });

              if (aiRes.ok) {
                try {
                  const aiData = await aiRes.json();
                  const content = aiData.choices?.[0]?.message?.content || '';
                  // 念のため余計な文字列（Markdownなど）を取り除く
                  const jsonMatch = content.match(/\{[\s\S]*?\}/);
                  if (jsonMatch) {
                     parsedResult = JSON.parse(jsonMatch[0]);
                     analysis = parsedResult.reason;
                  } else {
                     analysis = content;
                  }
                } catch (e) {}
              } else {
                const errBody = await aiRes.text().catch(() => '');
                console.warn(`AI Issue Triage failed: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              }
            } catch (e) {
              console.warn('GitHub Models request failed:', String(e));
            }

            const body = `### 🤖 AI Issue トリアージ提案\n\n${analysis}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            if (parsedResult && parsedResult.label) {
               try {
                 await github.rest.issues.addLabels({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   issue_number: context.issue.number,
                   labels: [parsedResult.label]
                 });
                 console.log(`Successfully added label: ${parsedResult.label}`);
               } catch (e) {
                 console.log('Failed to add label', e);
               }
            }
