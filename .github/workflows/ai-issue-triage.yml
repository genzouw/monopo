name: AI Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Tavily Search and AI Label Proposal
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, 4000);

            // 1. Tavily Search
            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: `Issue triage context for: ${title}`,
                search_depth: 'advanced',
                include_answer: true,
              }),
            });

            let searchAnswer = '検索結果の要約なし';
            if (tavilyRes.ok) {
              try {
                const searchData = await tavilyRes.json();
                searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
              } catch (e) {
                console.log('Failed to parse Tavily response');
              }
            }

            const prompt = `あなたは熟練のプロジェクトマネージャーです。以下のIssueの内容とWeb検索によるコンテキストをもとに、このIssueに付与すべき適切なラベル（bug, enhancement, question, request ai review, request ai tests など）を分析し、理由とともに日本語で提案してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            検索結果の要約: ${searchAnswer}`;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            let analysis = 'ラベルの提案に失敗しました。';
            if (aiRes.ok) {
              try {
                const aiData = await aiRes.json();
                analysis = aiData.choices?.[0]?.message?.content || analysis;
              } catch (e) {}
            }

            const body = `### 🤖 AI Issue トリアージ提案\n\n${analysis}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
