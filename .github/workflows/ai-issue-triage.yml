name: AI Issue Triage

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.label.name == 'request ai review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: AI Issue Triage
        uses: github/ai-assessment-comment-labeler@e3bedc38cfffa9179fe4cee8f7ecc93bffb3fee7 # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ai_review_label: 'request ai review'
          issue_number: ${{ github.event.issue.number }}
          issue_body: ${{ github.event.issue.body }}
          prompts_directory: '.github/prompts'
          labels_to_prompts_mapping: 'request ai review,triage.prompt.yml'
          model: 'o3-mini'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
