name: AI Issue Triage

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  triage:
    if: github.event.label.name == 'request ai review'
    runs-on: ubuntu-latest
    steps:
      - name: AI Issue Triage
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, 4000);

            // 1. Tavily Search
            const query = `Issue triage context: ${title}`;
            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: query,
                search_depth: 'basic',
                include_answer: true,
              }),
            });
            let searchAnswer = '要約なし';
            if (tavilyRes.ok) {
              try {
                const searchData = await tavilyRes.json();
                searchAnswer = (searchData.answer || '要約なし').slice(0, 2000);
              } catch (e) {}
            }

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のIssueの内容とWeb検索結果を分析し、以下の項目を日本語で回答してください。
            1. 優先度 (高, 中, 低) とその理由
            2. 推奨されるラベル
            3. このIssueを解決するために必要な大まかなステップ

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            関連コンテキスト: ${searchAnswer}
            `;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            let plan = 'トリアージ結果の生成に失敗しました。';
            if (aiRes.ok) {
              const aiData = await aiRes.json();
              plan = aiData.choices?.[0]?.message?.content || plan;
            }

            const body = `### 🤖 AI トリアージ結果\n\n${plan}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
