name: AI Release Notes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base-ref:
        description: 'Previous release tag (e.g., v1.0.0). Leave empty to automatically determine the previous tag.'
        required: false
      head-ref:
        description: 'New release tag (e.g., v1.1.0). Leave empty to use the latest tag.'
        required: false

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine refs
        id: refs
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_REF: ${{ github.event.inputs.base-ref }}
          INPUT_HEAD_REF: ${{ github.event.inputs.head-ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_REF="${INPUT_BASE_REF}"
            HEAD_REF="${INPUT_HEAD_REF}"

            if [ -z "$HEAD_REF" ]; then
              HEAD_REF=$(git describe --tags --abbrev=0)
            fi

            if [ -z "$BASE_REF" ]; then
              BASE_REF=$(git describe --tags --abbrev=0 "$HEAD_REF^")
            fi
          else
            HEAD_REF="${GIT_REF_NAME}"
            BASE_REF=$(git describe --tags --abbrev=0 "$HEAD_REF^" 2>/dev/null || echo "")
          fi

          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: steps.refs.outputs.base_ref != ''
        uses: github/copilot-release-notes@a334b927dc0db44c0358a0221928c2d9204ad7cc # v1.0.1
        with:
          base-ref: ${{ steps.refs.outputs.base_ref }}
          head-ref: ${{ steps.refs.outputs.head_ref }}
          instructions: '.github/release-notes-instructions.md'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.refs.outputs.base_ref != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.refs.outputs.head_ref }}
          RELEASE_NOTES: ${{ steps.notes.outputs.release-notes }}
        run: |
          gh release create "$HEAD_REF" \
            --draft \
            --notes "$RELEASE_NOTES"
