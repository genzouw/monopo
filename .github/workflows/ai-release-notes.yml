name: AI Release Notes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base-ref:
        description: 'Previous release tag (e.g., v1.0.0). Leave empty to automatically determine the previous tag.'
        required: false
      head-ref:
        description: 'New release tag (e.g., v1.1.0). Leave empty to use the latest tag.'
        required: false

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Determine refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE_REF="${{ github.event.inputs.base-ref }}"
            HEAD_REF="${{ github.event.inputs.head-ref }}"

            if [ -z "$HEAD_REF" ]; then
              HEAD_REF=$(git describe --tags --abbrev=0)
            fi

            if [ -z "$BASE_REF" ]; then
              BASE_REF=$(git describe --tags --abbrev=0 "$HEAD_REF^")
            fi
          else
            HEAD_REF="${{ github.ref_name }}"
            BASE_REF=$(git describe --tags --abbrev=0 "$HEAD_REF^" 2>/dev/null || echo "")
          fi

          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: steps.refs.outputs.base_ref != ''
        uses: github/copilot-release-notes@a334b927dc0db44c0358a0221928c2d9204ad7cc # v1.0.1
        with:
          base-ref: ${{ steps.refs.outputs.base_ref }}
          head-ref: ${{ steps.refs.outputs.head_ref }}
          instructions: '.github/release-notes-instructions.md'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.refs.outputs.base_ref != ''
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.refs.outputs.head_ref }}
          body: ${{ steps.notes.outputs.release-notes }}
          draft: true
