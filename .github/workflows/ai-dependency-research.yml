name: AI Dependency Research

on:
  pull_request:
    paths:
      - 'package.json'

permissions:
  contents: read

jobs:
  research-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze Added Dependencies and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # pragma: allowlist secret
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            async function getDependencyNames(ref) {
              try {
                const res = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'package.json',
                  ref,
                });
                const content = Buffer.from(res.data.content, 'base64').toString('utf8');
                const pkg = JSON.parse(content);
                return new Set([
                  ...Object.keys(pkg.dependencies || {}),
                  ...Object.keys(pkg.devDependencies || {}),
                ]);
              } catch (e) {
                console.warn(`package.json (${ref}) の取得に失敗しました:`, String(e));
                return new Set();
              }
            }

            const [baseDeps, headDeps] = await Promise.all([
              getDependencyNames(pr.data.base.sha),
              getDependencyNames(pr.data.head.sha),
            ]);

            const addedDeps = [...headDeps].filter((dep) => !baseDeps.has(dep));

            if (addedDeps.length === 0) {
              console.log('No new dependencies found.');
              return;
            }

            const currentYear = new Date().getUTCFullYear();
            const query = `${currentYear} security vulnerability issues best practices for npm packages: ${addedDeps.join(', ')}`;
            let searchContext = '検索結果なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {})
                },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: query,
                  search_depth: 'basic'
                })
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchContext = searchData.results?.map(r => r.content).join('\n') || '';
              }
            } catch (e) {
              console.warn('Tavily search failed:', String(e));
            }

            const prompt = `あなたはセキュリティエンジニアです。
            以下のPRで新しく追加されたパッケージ（${addedDeps.join(', ')}）について、Tavily Search APIの検索結果をもとに、最新のセキュリティリスクや導入の品質向上に関するインサイトを日本語で提供してください。

            【検索結果】
            ${searchContext.slice(0, 3000)}
            `;

            let aiRes;
            try {
              aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'o3-mini',
                  messages: [{ role: 'user', content: prompt }],
                  reasoning_effort: 'high',
                  max_completion_tokens: 15000
                })
              });
            } catch (e) {
              console.warn('GitHub Models request failed:', String(e));
              return;
            }

            if (aiRes.ok) {
              const aiData = await aiRes.json();
              const evaluation = aiData.choices?.[0]?.message?.content;
              if (evaluation) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `### 🛡️ AI 依存関係セキュリティリサーチ\n\n${evaluation}`
                });
              }
            }
