name: AI Tech Stack Advisor

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze-tech-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze Tech Stack and Trends
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # pragma: allowlist secret
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            let packageJson = '';
            try {
              packageJson = fs.readFileSync('package.json', 'utf8');
            } catch (e) {
              core.warning('package.json could not be read.');
            }

            let searchContext = '検索に失敗しました';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {})
                },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: "2025 latest AI coding tools automated CI CD pipelines GitHub Actions free open source best practices",
                  search_depth: 'basic'
                })
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchContext = searchData.results?.map(r => r.content).join('\n') || '';
              }
            } catch (e) {
              core.warning(`Tavily 検索に失敗しました: ${String(e)}`);
            }

            const prompt = `あなたは熟練のDevOpsエンジニアおよびAIツールスペシャリストです。
            以下のリポジトリの package.json と、最新のAIツール・CI/CDトレンドの検索結果をもとに、
            更なるAI活用や自動化・CI/CDパイプラインの最適化のための導入提案を日本語で行ってください。
            ※必ず公開リポジトリで無料で使えるツールやサービス、設定を前提として提案してください。

            【検索結果】
            ${searchContext.slice(0, 3000)}

            【package.json】
            ${packageJson.slice(0, 3000)}
            `;

            let aiRes;
            try {
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。');
              }
              aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 15000
                })
              });
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
              return;
            }

            if (!aiRes.ok) {
              core.warning(`AI 分析に失敗しました: HTTP ${aiRes.status}`);
              return;
            }

            let aiData;
            try {
              aiData = await aiRes.json();
            } catch (e) {
              core.warning(`JSON パースエラー: ${String(e)}`);
              return;
            }
            const evaluation = aiData.choices?.[0]?.message?.content;
            if (!evaluation) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 週間 AI テックスタック・CI/CD 最適化提案',
              body: `## 今週の技術トレンドに基づく改善提案\n\n${evaluation}`
            });
