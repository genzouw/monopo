name: Pollen Supply Chain Scan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: pollen-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pollen-scan:
    name: Run Pollen Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.0'

      - name: Install Pollen
        run: |
          go install github.com/bantuson/pollen/cmd/pollen@v0.2.0

      - name: Verify Pollen installation (selftest)
        run: |
          "$(go env GOPATH)/bin/pollen" selftest

      - name: Run Pollen Supply Chain Scan
        run: |
          set +e
          "$(go env GOPATH)/bin/pollen" scan --profile project --root ./ > pollen-inventory.ndjson 2> pollen-scan.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Pollen scan exited with status $status: $(tail -c 500 pollen-scan.log)"
          fi

      - name: Upload Pollen inventory artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pollen-inventory
          path: pollen-inventory.ndjson
