name: Pollen Supply Chain Scan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  pollen_scan:
    name: Run Pollen Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.0'

      - name: Install Pollen
        run: |
          go install github.com/bantuson/pollen/cmd/pollen@v0.2.0

      - name: Verify Pollen installation (selftest)
        run: |
          "$(go env GOPATH)/bin/pollen" selftest

      - name: Run Pollen Supply Chain Scan
        run: |
          "$(go env GOPATH)/bin/pollen" project ./ || echo "::warning::Pollen scan detected suspicious packages or encountered an error. Please check logs."
