name: AI Weekly Tech Trend Analyzer

on:
  schedule:
    - cron: '0 9 * * 1' # 毎週月曜日の午前9時（UTC）に実行
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Search and Generate Trend Report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            // トークン上限超過とコスト増を防ぐため、プロンプトに埋め込む値は文字数で truncate する
            const MAX_SEARCH_ANSWER_CHARS = 1500;
            const year = new Date().getFullYear();

            async function searchTavily(query) {
              let data = { answer: '', results: [] };
              try {
                const res = await fetch('https://api.tavily.com/search', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {}) },
                  signal: AbortSignal.timeout(30000),
                  body: JSON.stringify({
                    query,
                    search_depth: 'basic',
                    include_answer: true,
                    topic: 'news',
                    days: 7,
                  }),
                });

                if (res.ok) {
                  try {
                    data = await res.json();
                  } catch (e) {
                    console.log('Failed to parse Tavily response as JSON:', e);
                  }
                } else {
                  console.log(`Tavily request failed: ${res.status} ${res.statusText}`);
                }
              } catch (e) {
                console.warn('Tavily search failed:', String(e));
              }
              return data;
            }

            // 1. Tavily Search for Web Development Trends
            const devSearchData = await searchTavily(`${year} latest React TypeScript Vite Bun frontend architecture best practices`);
            const devContext = (devSearchData.answer || 'Web開発トレンドの検索に失敗しました。').slice(0, MAX_SEARCH_ANSWER_CHARS)
              + '\n' + (devSearchData.results?.map(r => r.content).join('\n') || '').slice(0, MAX_SEARCH_ANSWER_CHARS);

            // 2. Tavily Search for AI/CI Tool Trends
            const aiSearchData = await searchTavily(`${year} latest GitHub Actions AI tools open source free for public repo`);
            const aiContext = (aiSearchData.answer || 'AIツールの検索に失敗しました。').slice(0, MAX_SEARCH_ANSWER_CHARS)
              + '\n' + (aiSearchData.results?.map(r => r.content).join('\n') || '').slice(0, MAX_SEARCH_ANSWER_CHARS);

            // 3. GitHub Models によるサマリー生成
            const prompt = `あなたは最新のテクノロジーに精通したシニアテックリードです。以下の最新の検索結果をもとに、プロジェクトの技術スタック（React, TypeScript, Vite, Bun）に役立つ開発トレンドと、公開リポジトリで無料で使える最新のAIツール・自動化パイプライン（CI/CD）の提案をまとめた日本語のレポートを作成してください。

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            【Web開発トレンド (検索結果)】
            ${devContext}

            【AI・自動化ツールトレンド (検索結果)】
            ${aiContext}
            `;

            let report;
            try {
              const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'o3-mini',
                  messages: [{ role: 'user', content: prompt }],
                  reasoning_effort: 'high',
                  max_completion_tokens: 15000
                })
              });

              if (aiRes.ok) {
                try {
                  const aiData = await aiRes.json();
                  report = aiData.choices?.[0]?.message?.content;
                } catch (e) {
                  console.log('Failed to parse GitHub Models response as JSON:', e);
                }
              } else {
                const errorBody = await aiRes.text().catch(() => '<failed to read body>');
                console.log(`GitHub Models request failed: ${aiRes.status} ${aiRes.statusText}`);
                console.log('Response body:', errorBody);
              }
            } catch (e) {
              console.warn('GitHub Models request failed:', String(e));
            }

            if (report) {
              let body = `### 🤖 今週の技術トレンド＆AIツール導入提案\n\n${report}\n\n#### 参考ソース\n`;
              [...(devSearchData.results || []), ...(aiSearchData.results || [])].forEach(r => {
                body += `- [${r.title}](${r.url})\n`;
              });

              const titleDate = new Date().toISOString().split('T')[0];
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 AI Weekly Tech & Tool Trend Report (${titleDate})`,
                body: body,
                labels: ['enhancement', 'ai-generated', 'research']
              });
            }
