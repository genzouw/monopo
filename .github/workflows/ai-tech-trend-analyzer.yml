name: AI Weekly Tech Trend Analyzer

on:
  schedule:
    - cron: '0 9 * * 1' # 毎週月曜日の午前9時（UTC）に実行
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch Trends and Generate Report
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            // トークン上限超過とコスト増を防ぐため、プロンプトに埋め込む値は文字数で truncate する
            const MAX_SEARCH_ANSWER_CHARS = 3000;

            // 1. Tavily Search
            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: `2025 latest frontend React 19 Bun AI CI/CD optimization tech trends`,
                search_depth: 'advanced',
                include_answer: true,
              }),
            });

            let searchData = { answer: '要約なし', results: [] };
            if (tavilyRes.ok) {
              try {
                searchData = await tavilyRes.json();
              } catch (e) {
                console.log('Failed to parse Tavily response as JSON:', e);
              }
            } else {
              console.log(`Tavily request failed: ${tavilyRes.status} ${tavilyRes.statusText}`);
            }
            const searchAnswer = (searchData.answer || '要約なし').slice(0, MAX_SEARCH_ANSWER_CHARS);

            // 2. GitHub Models によるサマリー生成
            const prompt = `あなたは最新のIT、コンピューターサイエンス、フロントエンド技術に精通したシニアエンジニアです。
            以下のWeb検索結果をもとに、今週の最新技術トレンド（特にReact 19、Bun、AIを活用したCI/CDパイプライン、自動化ツールについて）を日本語でわかりやすく要約し、私たちのプロジェクト（monopo）への応用可能性や推奨事項を提案してください。

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            検索結果の要約: ${searchAnswer}
            `;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            let report = 'トレンドレポートの生成に失敗しました。';
            if (aiRes.ok) {
              try {
                const aiData = await aiRes.json();
                report = aiData.choices?.[0]?.message?.content || report;
              } catch (e) {
                console.log('Failed to parse GitHub Models response as JSON:', e);
              }
            } else {
              const errorBody = await aiRes.text().catch(() => '<failed to read body>');
              console.log(`GitHub Models request failed: ${aiRes.status} ${aiRes.statusText}`);
              console.log('Response body:', errorBody);
            }

            let body = `### 🤖 AI Weekly Tech Trend Report\n\n${report}\n\n#### 参考ソース\n`;
            if(searchData.results) {
               searchData.results.forEach(r => { body += `- [${r.title}](${r.url})\n`; });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 今週の技術トレンド分析レポート (${new Date().toISOString().split('T')[0]})`,
              body: body,
              labels: ['enhancement', 'ai-generated']
            });
