name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 08:00 JST (= 日曜 23:00 UTC) に再スキャン
    - cron: '0 23 * * 0'
  workflow_dispatch:

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # リポジトリのソースコード読み込み用
  contents: read

jobs:
  osv-scanner:
    name: Scan OSS dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OSV スキャン結果を GitHub Security タブへアップロードするために必要
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        # 既存依存パッケージへの新規 CVE 登録（特に定期スキャン実行）で
        # CI 全体が落ちるのを防ぐため continue-on-error を有効化している。
        # 検出された脆弱性は次ステップで SARIF として GitHub Security タブへ
        # アップロードされ可視性は維持される。脆弱性検知の信頼性を高めたい場合は
        # この設定を見直すこと（依存更新運用の安定化後に再評価予定）。
        continue-on-error: true
        with:
          scan-args: |-
            -r
            --format=sarif
            --output-file=osv-scanner.sarif
            ./

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: 'osv-scanner.sarif'
          category: osv-scanner
