name: AI Weekly Project Summary

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Gather Project Activity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: gather
        with:
          script: |
            const oneWeekAgo = new Date(new Date() - 7 * 24 * 60 * 60 * 1000).toISOString();

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: oneWeekAgo
            });

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc'
            });

            const recentPRs = prs.data.filter(pr => pr.merged_at && pr.merged_at > oneWeekAgo);

            let summaryContext = "### Recent Commits\n";
            commits.data.slice(0, 50).forEach(c => {
               summaryContext += `- ${c.commit.message.split('\n')[0]}\n`;
            });

            summaryContext += "\n### Merged PRs\n";
            recentPRs.forEach(pr => {
               summaryContext += `- ${pr.title}\n`;
            });

            return summaryContext;

      - name: Generate AI Summary and Search Trends
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ACTIVITY_CONTEXT: ${{ steps.gather.outputs.result }}
        with:
          script: |
            const activity = process.env.ACTIVITY_CONTEXT;

            // 1. Tavily Search for latest dev trends
            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: `2025 latest github actions ci/cd automation trends and best practices`,
                search_depth: 'advanced',
                include_answer: true,
              }),
            });
            let searchAnswer = '検索結果の要約なし';
            if (tavilyRes.ok) {
              const searchData = await tavilyRes.json();
              searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
            }

            const prompt = `あなたは熟練のプロジェクトマネージャーです。
            以下の直近1週間のプロジェクトのコミットとマージされたPRの履歴、およびWeb検索から得られた最新のCI/CD自動化トレンドをもとに、
            今週の開発進捗のサマリー、直面している課題の推測、および今後のAI自動化や品質向上のための提案を日本語で作成してください。

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Web検索による最新トレンド:
            ${searchAnswer}

            直近1週間のアクティビティ:
            ${activity}
            `;

            const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            const data = await response.json();
            const analysis = data.choices?.[0]?.message?.content;

            if (analysis) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 AI Weekly Project Summary (${new Date().toISOString().split('T')[0]})`,
                body: `### 🤖 AI プロジェクト週次サマリー\n\n${analysis}`,
                labels: ['enhancement', 'ai-generated']
              });
            }
