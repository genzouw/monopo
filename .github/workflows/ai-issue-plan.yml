name: AI Issue Plan

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Issue Implementation Plan
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        with:
          script: |
            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, 4000);

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のIssueの内容をもとに、実装に必要なファイルのリストと大まかなタスクリスト（たたき台）を日本語で作成してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            `;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            let plan = 'タスクリストの生成に失敗しました。';
            if (aiRes.ok) {
              try {
                const aiData = await aiRes.json();
                plan = aiData.choices?.[0]?.message?.content || plan;
              } catch (e) {
                console.log('Failed to parse GitHub Models response as JSON:', e);
              }
            } else {
              const errorBody = await aiRes.text().catch(() => '<failed to read body>');
              console.log(`GitHub Models request failed: ${aiRes.status} ${aiRes.statusText}`);
              console.log('Response body:', errorBody);
            }

            const body = `### 🤖 AI 実装計画 (たたき台)\n\n${plan}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
