name: Qodo Merge (PR-Agent)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      # Qodo Merge (旧 PR-Agent) の実行
      # AI を活用してプルリクエストのレビュー、説明の生成、類似 Issue の検索を自動化します。
      # GitHub Models の GPT-4o などの無料 API を利用することで、公開リポジトリにて無料で運用可能です。
      # 事前準備:
      # - OPENAI_KEY: OpenAI 互換の API キー (GitHub Models など無料の API エンドポイントを利用可能)
      # - PINECONE_API_KEY: Pinecone API キー
      # - PINECONE_ENVIRONMENT: Pinecone 環境
      - name: Run Qodo Merge
        uses: Codium-ai/pr-agent@31d7dd027968e5fad1f9cbb074be047c4869058e
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
