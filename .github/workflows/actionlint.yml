name: actionlint

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'
  schedule:
    # 毎週火曜 09:07 JST (= 火曜 00:07 UTC) に定期監査（毎時 00 分の高負荷を避けて 7 分にずらす）
    - cron: '7 0 * * 2'
  workflow_dispatch:

concurrency:
  group: actionlint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    uses: genzouw/ci-workflows/.github/workflows/actionlint.yml@72c41cae612a1cea531036dbe6d1970266b1b547 # v1.4.7
