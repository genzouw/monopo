name: AI PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Auto Label PR
    # fork からの PR と Dependabot の PR は GITHUB_TOKEN が読み取り専用となりラベル操作に失敗するため対象外にする
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Add AI-related labels via Free Action
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // PRタイトルを元に、AI関連のラベルを自動で付与するスクリプトです。
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const title = context.payload.pull_request.title.toLowerCase();

            const LABEL = 'ai-integration';
            // タイトルにai・robot・coderabbitが単語として含まれる場合、ai-integrationラベルを付与する。
            // fail / main / detail などの部分一致を避けるため、前後が英字でないことを条件にする。
            // 日本語が隣接する「AIツール」でも一致させるため、\b ではなく英字の否定先読み・後読みを使う。
            const shouldLabel = /(?<![a-z])(ai|robot|coderabbit)(?![a-z])/.test(title);
            const hasLabel = context.payload.pull_request.labels.some((l) => l.name === LABEL);

            if (shouldLabel && !hasLabel) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [LABEL]
              });
            } else if (!shouldLabel && hasLabel) {
              // edited でタイトルが変わり条件を満たさなくなった場合は、付与済みのラベルを外す。
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull_number,
                name: LABEL
              });
            }
