name: AI PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Auto Label PR
    # fork からの PR は GITHUB_TOKEN が読み取り専用となりラベル付与に失敗するため対象外にする
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Add AI-related labels via Free Action
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // PRタイトルを元に、AI関連のラベルを自動で付与するスクリプトです。
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const title = context.payload.pull_request.title.toLowerCase();

            const labelsToAdd = [];
            // タイトルにaiやrobotが含まれる場合、ai-integrationラベルを付与する
            if (title.includes('ai') || title.includes('robot') || title.includes('coderabbit')) labelsToAdd.push('ai-integration');

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: labelsToAdd
              });
            }
