name: fallow

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
# PR が変更した TS/JS ファイルに「新たに持ち込まれた」未使用コード・循環依存・
# 重複・複雑度の悪化だけを検出する (既存の負債では落ちない)。
# audit は base との差分を前提にするため pull_request でのみ動かす。
on:
  pull_request:
    branches: [main, master]

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fallow:
    uses: genzouw/ci-workflows/.github/workflows/fallow.yml@b6a71471033888f2d8c59b882e4659f1f1121d18 # v1.5.8
