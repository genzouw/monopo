name: CodeAnt AI CI Scan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  codeant_scan:
    name: Run CodeAnt CI scan
    runs-on: ubuntu-latest
    env:
      HAS_ACCESS_TOKEN_GITHUB: ${{ secrets.ACCESS_TOKEN_GITHUB != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ACCESS_TOKEN_GITHUB 未設定時の警告
        if: ${{ env.HAS_ACCESS_TOKEN_GITHUB != 'true' }}
        run: echo "::warning::ACCESS_TOKEN_GITHUB が未設定のため、CodeAnt CI Scan をスキップします。設定手順は docs/security/ai-ci-tools.md を参照してください。"

      - name: Run CodeAnt CI Scan
        if: ${{ env.HAS_ACCESS_TOKEN_GITHUB == 'true' }}
        uses: CodeAnt-AI/codeant-ci-scan-action@82f83c97a923b626244fdbf9b749ae37308eaf9e # v0.0.5
        with:
          access_token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          scanners: 'sast,sca,secrets'
          scan_timeout: '600'
