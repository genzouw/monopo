name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@4bc047ad259df6cb240e560f131fcc28bf67396d # v2
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@4bc047ad259df6cb240e560f131fcc28bf67396d # v2
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@4bc047ad259df6cb240e560f131fcc28bf67396d # v2
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@4bc047ad259df6cb240e560f131fcc28bf67396d # v2
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

  test:
    name: Test (with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@4bc047ad259df6cb240e560f131fcc28bf67396d # v2
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  audit:
    name: bun pm untrusted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@4bc047ad259df6cb240e560f131fcc28bf67396d # v2
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
ritical のみブロックする。/d
      - run: bun pm untrusted
