name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Reviewdog ESLint
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '.'
          fail_on_error: true

  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

  test:
    name: Test (with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  audit:
    name: bun pm untrusted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun install --frozen-lockfile --ignore-scripts
      # NOTE: `bun audit` は bun 1.2.21 以降で追加されたため、pin している 1.2.14 では未対応。
      # 脆弱性チェックは当面 Dependabot に委ね、bun-version を引き上げる際に audit を再追加する。
      - run: bun pm untrusted

  ai-guidelines-sync:
    name: AI Guidelines Sync Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - run: bun run sync:ai-guidelines:check

  banned-files-check:
    name: Banned Files Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check for banned files
        run: |
          set -euo pipefail
          echo "🔍 Scanning for banned sensitive files and AI workspaces..."
          BANNED_FILES=$(find . -type f \( \
            -name ".env" -o -name ".env.*" \
            -o -name "*.pem" -o -name "*.key" \
            -o -name "*credentials*.json" -o -name "*credentials*.yml" -o -name "*credentials*.yaml" -o -name "*credentials*.env" \
            -o -name "*secret*.json" -o -name "*secret*.yml" -o -name "*secret*.yaml" -o -name "*secret*.env" \
            -o -name "*.npmrc" -o -name ".netrc" -o -name "*.p12" -o -name "*.pfx" -o -name "*.keystore" \
            -o -name "*.sqlite" -o -name "*.sqlite3" -o -name "*.db" \
            -o -name "*service-account*.json" -o -name "*serviceaccount*.json" \
            -o -name "*.tfstate" -o -name "*.tfstate.backup" \
            -o -path "*/.cursor/*" -o -path "*/.claude/*" -o -path "*/.aider*/*" \
            -o -path "*/.continue/*" -o -path "*/.jules/*" -o -path "*/.cline/*" \
            -o -path "*/.windsurf/*" -o -path "*/.trae/*" -o -name "*-report.md" \
            \) -not -name ".env.example" -not -path "*/node_modules/*" -not -path "*/.git/*" || true)

          if [ -n "$BANNED_FILES" ]; then
            echo "::error::❌ Banned files detected! Please remove them from the repository:"
            echo "$BANNED_FILES"
            exit 1
          fi
          echo "✅ No banned files found."
