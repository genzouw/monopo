name: AI A11y Reviewer

on:
  pull_request:
    paths:
      - 'src/**/*'

permissions:
  contents: read

jobs:
  review-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14

      - name: Bundle Codebase Context with Repomix
        run: bunx repomix@1.16.0 --style xml --output codebase.xml

      - name: Fetch PR Diff
        id: fetch-diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });
            return diff.data.slice(0, 10000);

      - name: Perform Accessibility Review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PR_DIFF: ${{ steps.fetch-diff.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;
            const title = context.payload.pull_request.title;
            const prDiff = process.env.PR_DIFF;

            let codebase = '<empty>';
            try {
              codebase = fs.readFileSync('codebase.xml', 'utf8').slice(0, 15000);
            } catch (e) {
              console.log('Repomix output not found.');
            }

            let searchAnswer = '検索結果なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  api_key: process.env.TAVILY_API_KEY,
                  query: `2025 latest Web Content Accessibility Guidelines WCAG React UI UX best practices for: ${title}`,
                  search_depth: 'advanced',
                  include_answer: true,
                }),
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
              }
            } catch (e) {}

            const prompt = `あなたはアクセシビリティ(A11y)およびUI/UXの専門家です。
            以下のPRの差分、プロジェクトのコードベース、および最新のWeb検索のベストプラクティスをもとに、
            フロントエンドの変更がWCAGに準拠しているか、スクリーンリーダーのサポートやキーボード操作、適切なARIA属性の付与ができているかを日本語でレビューしてください。

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Web検索結果: ${searchAnswer}

            コードベース概要 (XML):
            ${codebase}

            差分:
            ${prDiff}`;

            let analysis = null;
            try {
              const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                body: JSON.stringify({
                  model: 'o3-mini',
                  messages: [{ role: 'user', content: prompt }]
                })
              });

              if (aiRes.ok) {
                const aiData = await aiRes.json();
                analysis = aiData.choices?.[0]?.message?.content;
              }
            } catch (e) {}

            if (analysis) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 AI Accessibility Review\n\n${analysis}`
              });
            }
