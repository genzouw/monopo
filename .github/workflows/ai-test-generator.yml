name: AI Test Generator

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  generate-tests:
    if: github.event.label.name == 'request ai tests'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Tests and Comment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        with:
          script: |
            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, 4000);

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のIssueの内容をもとに、Vitest を使用したテストコードのモック・実装案を日本語の解説とともに作成してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            `;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            let plan = 'テストコードの生成に失敗しました。';
            if (aiRes.ok) {
              try {
                const aiData = await aiRes.json();
                plan = aiData.choices?.[0]?.message?.content || plan;
              } catch (e) {
                console.log('Failed to parse GitHub Models response as JSON:', e);
              }
            }

            const body = `### 🤖 AI 自動テストコード生成提案\n\n${plan}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
