name: AI Test Generator

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  generate-tests:
    if: github.event.label.name == 'request ai tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Generate Tests and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, 4000);

            let searchAnswer = '検索結果の要約なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {}) },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: `2025 Latest Vitest React Testing Library best practices for: ${title}`,
                  search_depth: 'basic',
                  include_answer: true,
                }),
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
              }
            } catch (e) {
              core.warning(`Tavily の応答の取得または解析に失敗しました: ${String(e)}`);
            }

            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のIssueの内容とWeb検索による最新のベストプラクティスをもとに、Vitest を使用したテストコードのモック・実装案を日本語の解説とともに作成してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            検索結果の要約: ${searchAnswer}
            `;

            // 生成に失敗した場合は null のままとし、Issue へのコメント投稿自体を見送る
            let plan = null;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              const aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],

                  max_tokens: 15000
                })
              });

              if (aiRes.ok) {
                try {
                  const aiData = await aiRes.json();
                  plan = aiData.choices?.[0]?.message?.content || plan;
                } catch (e) {
                  core.warning(`GitHub Models の応答が不正な JSON でした: ${String(e)}`);
                }
              } else {
                const errBody = await aiRes.text().catch(() => '');
                core.warning(`AI テスト生成に失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              }
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
            }

            if (!plan) {
              core.warning('AI 自動テストコード生成提案を生成できなかったため Issue へのコメントを見送ります。');
              return;
            }

            const body = `### 🤖 AI 自動テストコード生成提案\n\n${plan}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
