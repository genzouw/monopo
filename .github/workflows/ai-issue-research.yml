name: AI Issue Research
on:
  issues:
    types: [labeled]
permissions:
  issues: write
  contents: read
jobs:
  research:
    if: github.event.label.name == 'request ai research'
    runs-on: ubuntu-latest
    steps:
      - name: Tavily Search & OpenAI Plan Generation
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
        with:
          script: |
            const query = context.payload.issue.title + "\n\n" + (context.payload.issue.body || "");
            const tavilyResponse = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: query,
                search_depth: 'advanced',
                include_answer: true,
              }),
            });
            const tavilyData = await tavilyResponse.json();
            const searchResults = tavilyData.answer || 'No summary available.';

            let planText = searchResults;

            if (process.env.OPENAI_API_KEY) {
              const openaiResponse = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: 'gpt-4o',
                  messages: [
                    {
                      role: 'system',
                      content: 'あなたはシニアソフトウェアエンジニアです。提供された検索結果とIssueの内容をもとに、React 19とBunを使用し、「monopoly」ではなく「monopo」という名称を用いるプロジェクトの制約を考慮した、具体的な実装計画を日本語で作成してください。'
                    },
                    {
                      role: 'user',
                      content: `Issue内容:\n${query}\n\n検索結果:\n${searchResults}`
                    }
                  ],
                  temperature: 0.7,
                }),
              });

              if (openaiResponse.ok) {
                const openaiData = await openaiResponse.json();
                planText = openaiData.choices[0]?.message?.content || searchResults;
              } else {
                console.error("OpenAI API error", await openaiResponse.text());
              }
            }

            let body = `### AI Research & Implementation Plan\n\n${planText}\n\n#### Sources\n`;
            if(tavilyData.results) {
               tavilyData.results.forEach(r => { body += `- [${r.title}](${r.url})\n`; });
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
