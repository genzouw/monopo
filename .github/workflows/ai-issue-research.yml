name: AI Issue Research
on:
  issues:
    types: [labeled]
permissions:
  issues: write

jobs:
  research:
    if: github.event.label.name == 'request ai research'
    runs-on: ubuntu-latest
    steps:
      - name: Tavily Search and AI Plan Generation
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            // トークン上限超過とコスト増を防ぐため、プロンプトに埋め込む値は文字数で truncate する
            const MAX_ISSUE_BODY_CHARS = 4000;
            const MAX_SEARCH_ANSWER_CHARS = 2000;

            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, MAX_ISSUE_BODY_CHARS);
            const query = title;

            // 1. Tavily Search
            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                api_key: process.env.TAVILY_API_KEY,
                query: query,
                search_depth: 'advanced',
                include_answer: true,
              }),
            });

            let searchData = { answer: '要約なし', results: [] };
            if (tavilyRes.ok) {
              try {
                searchData = await tavilyRes.json();
              } catch (e) {
                console.log('Failed to parse Tavily response as JSON:', e);
              }
            } else {
              console.log(`Tavily request failed: ${tavilyRes.status} ${tavilyRes.statusText}`);
            }
            const searchAnswer = (searchData.answer || '要約なし').slice(0, MAX_SEARCH_ANSWER_CHARS);

            // 2. GitHub Models による実装計画の生成 (公開リポジトリで無料)
            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のIssueの要件とWeb検索結果をもとに、プロジェクトの具体的な実装計画を日本語で作成してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            検索結果の要約: ${searchAnswer}
            `;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'openai/gpt-4o-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            let plan = '実装計画の生成に失敗しました。';
            if (aiRes.ok) {
              try {
                const aiData = await aiRes.json();
                plan = aiData.choices?.[0]?.message?.content || plan;
              } catch (e) {
                console.log('Failed to parse GitHub Models response as JSON:', e);
              }
            } else {
              const errorBody = await aiRes.text().catch(() => '<failed to read body>');
              console.log(`GitHub Models request failed: ${aiRes.status} ${aiRes.statusText}`);
              console.log('Response body:', errorBody);
            }

            let body = `### 🤖 AI リサーチ結果 & 実装計画\n\n${plan}\n\n#### 参考ソース\n`;
            if(searchData.results) {
               searchData.results.forEach(r => { body += `- [${r.title}](${r.url})\n`; });
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
