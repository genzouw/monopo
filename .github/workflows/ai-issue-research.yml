name: AI Issue Research
on:
  issues:
    types: [labeled]
permissions:
  contents: read

jobs:
  research:
    if: github.event.label.name == 'request ai research'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: AI Plan Generation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # pragma: allowlist secret
        with:
          script: |
            // トークン上限超過とコスト増を防ぐため、プロンプトに埋め込む値は文字数で truncate する
            const MAX_ISSUE_BODY_CHARS = 4000;
            const MAX_SEARCH_ANSWER_CHARS = 2000;

            const title = context.payload.issue.title;
            const issueBody = (context.payload.issue.body || '').slice(0, MAX_ISSUE_BODY_CHARS);

            // CLAUDE.md 最重要原則: 従量課金の検索API（Tavily）をCI/CDに組み込むことは禁止されているため、Web検索は無効化しています。
            const searchData = { answer: '要約なし（Web検索はコスト方針により無効化されています）', results: [] };
            const searchAnswer = searchData.answer.slice(0, MAX_SEARCH_ANSWER_CHARS);

            // 2. GitHub Models による実装計画の生成 (公開リポジトリで無料)
            const prompt = `あなたは熟練のソフトウェアエンジニアです。以下のIssueの要件とWeb検索結果をもとに、プロジェクトの具体的な実装計画を日本語で作成してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Issueタイトル: ${title}
            Issue本文: ${issueBody}
            検索結果の要約: ${searchAnswer}
            `;

            // GitHub Models (公開リポジトリで無料・OpenAI互換API)
            // GH_MODELS_TOKEN で認証
            // 生成に失敗した場合は null のままとし、Issue へのコメント投稿自体を見送る
            let plan = null;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              const aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 15000
                })
              });

              if (aiRes.ok) {
                try {
                  const aiData = await aiRes.json();
                  plan = aiData.choices?.[0]?.message?.content || plan;
                } catch (e) {
                  core.warning(`GitHub Models の応答が不正な JSON でした: ${String(e)}`);
                }
              } else {
                const errorBody = await aiRes.text().catch(() => '<failed to read body>');
                core.warning(`GitHub Models へのリクエストに失敗しました: ${aiRes.status} ${aiRes.statusText} ${String(errorBody).slice(0, 500)}`);
              }
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
            }

            if (!plan) {
              core.warning('AI リサーチ結果 & 実装計画を生成できなかったため Issue へのコメントを見送ります。');
              return;
            }

            let body = `### 🤖 AI リサーチ結果 & 実装計画\n\n${plan}\n\n#### 参考ソース\n`;
            if(searchData.results) {
               searchData.results.forEach(r => { body += `- [${r.title}](${r.url})\n`; });
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
