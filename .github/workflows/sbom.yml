name: SBOM Generation

on:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 07:00 JST (= 日曜 22:00 UTC) に再スキャン
    - cron: '0 22 * * 0'
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM and push to Dependency Graph
    runs-on: ubuntu-latest
    permissions:
      # contents: write includes read
      contents: write # required to upload to Dependency Graph
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM and upload to Dependency Graph
        # Use specific SHA to pin version
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.17.9
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
          dependency-graph: true

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 14
