name: SBOM Generation

on:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 07:00 JST (= 日曜 22:00 UTC) に再スキャン
    - cron: '0 22 * * 0'
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-sbom:
    name: Generate SBOM and push to Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate SBOM and upload to Dependency Graph
        # Use specific SHA to pin version
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.17.9
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
          dependency-graph: true

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 14
