name: lychee

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
#
# 検査対象: Markdown / HTML 内の相対リンクと外部 URL (実体側の既定引数を使用)。
# 除外ホストや root_dir などのリポジトリ固有設定はルートの lychee.toml に置く。
on:
  push:
    branches: [main, master]
    paths:
      - '**/*.md'
      - '**/*.html'
      - 'public/**'
      - 'lychee.toml'
      - '.github/workflows/lychee.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.md'
      - '**/*.html'
      - 'public/**'
      - 'lychee.toml'
      - '.github/workflows/lychee.yml'
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC)。リンク切れはコミットと無関係に発生するため。
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    uses: genzouw/ci-workflows/.github/workflows/lychee.yml@c7627b6a99d8b3a2c8e8cdeba120c42070f37bd0 # v1.3.1
