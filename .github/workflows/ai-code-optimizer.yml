name: AI Code Optimizer

on:
  # GitHub Models が廃止プロセス（retirement brownout）に入り HTTP 410 を返すため、
  # 移行先が決まるまでスケジュール実行を停止する（詳細は Issue #539）。
  # 手動実行は workflow_dispatch から可能。復旧時は以下のコメントを解除すること。
  # schedule:
  #   - cron: '0 0 * * 0' # 毎週日曜日に実行
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14

      - name: Bundle Codebase Context with Repomix
        run: bunx repomix@1.16.0 --style xml --output codebase.xml

      - name: Generate Optimization Report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            let codebase = '<empty>';
            try {
              codebase = fs.readFileSync('codebase.xml', 'utf8').slice(0, 15000);
            } catch (e) {
              console.log('Repomix output not found.');
            }

            let searchContext = '検索結果なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {})
                },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: "2025 latest React 19 Bun TypeScript performance security best practices",
                  search_depth: 'basic'
                })
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchContext = searchData.results?.map(r => r.content).join('\n') || '';
              }
            } catch (e) {
              core.warning(`Tavily 検索に失敗しました: ${String(e)}`);
            }

            const prompt = `あなたは熟練のDevOpsエンジニアおよびソフトウェアアーキテクトです。
            以下の最新ベストプラクティス（Web検索結果）とプロジェクトのコードベース概要をもとに、コードの品質向上、パフォーマンス最適化、およびセキュリティ強化のための具体的な改善提案を日本語で出力してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            【最新のベストプラクティス】
            ${searchContext.slice(0, 3000)}

            【コードベース概要 (XML)】
            ${codebase}`;

            let aiRes;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 15000
                })
              });
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
              return;
            }

            if (!aiRes.ok) {
              const errBody = await aiRes.text().catch(() => '');
              core.warning(`AI コード最適化に失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              return;
            }

            let aiData;
            try {
              aiData = await aiRes.json();
            } catch (e) {
              core.warning(`GitHub Models の応答が不正な JSON でした: ${String(e)}`);
              return;
            }
            const report = aiData.choices?.[0]?.message?.content;
            if (!report) {
              // content 空は max_tokens を使い切った（finish_reason: 'length'）可能性のあるサイン。
              core.warning(`GitHub Models から分析結果が返されませんでした。${JSON.stringify(aiData).slice(0, 500)}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 AI定期コード最適化レポート (${new Date().toISOString().split('T')[0]})`,
              body: `### 🤖 AI コード最適化レポート\n\n${report}`,
              labels: ['enhancement', 'ai-generated']
            });
