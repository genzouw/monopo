name: AI Code Optimizer

on:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日に実行
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14

      - name: Bundle Codebase Context with Repomix
        run: bunx repomix@1.16.0 --style xml --output codebase.xml

      - name: Generate Optimization Report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            let codebase = '<empty>';
            try {
              codebase = fs.readFileSync('codebase.xml', 'utf8').slice(0, 15000);
            } catch (e) {
              console.log('Repomix output not found.');
            }

            const tavilyRes = await fetch('https://api.tavily.com/search', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.TAVILY_API_KEY}`
              },
              body: JSON.stringify({
                query: "2025 latest React 19 Bun TypeScript performance security best practices",
                search_depth: 'advanced'
              })
            });

            let searchContext = '検索結果なし';
            if (tavilyRes.ok) {
              const searchData = await tavilyRes.json();
              searchContext = searchData.results?.map(r => r.content).join('\n') || '';
            }

            const prompt = `あなたは熟練のDevOpsエンジニアおよびソフトウェアアーキテクトです。
            以下の最新ベストプラクティス（Web検索結果）とプロジェクトのコードベース概要をもとに、コードの品質向上、パフォーマンス最適化、およびセキュリティ強化のための具体的な改善提案を日本語で出力してください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            【最新のベストプラクティス】
            ${searchContext.slice(0, 3000)}

            【コードベース概要 (XML)】
            ${codebase}`;

            const aiRes = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
              },
              body: JSON.stringify({
                model: 'o3-mini',
                messages: [{ role: 'user', content: prompt }]
              })
            });

            if (aiRes.ok) {
              const aiData = await aiRes.json();
              const report = aiData.choices?.[0]?.message?.content;
              if (report) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🤖 AI定期コード最適化レポート (${new Date().toISOString().split('T')[0]})`,
                  body: `### 🤖 AI Code Optimization Report\n\n${report}`,
                  labels: ['enhancement', 'ai-generated']
                });
              }
            }
