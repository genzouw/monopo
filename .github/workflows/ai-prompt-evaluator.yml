name: AI Prompt Evaluator

on:
  pull_request:
    paths:
      - 'prompts/**'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up promptfoo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/promptfoo
          key: ${{ runner.os }}-promptfoo-${{ hashFiles('prompts/**') }}
          restore-keys: |
            ${{ runner.os }}-promptfoo-

      - name: Setup Ollama
        uses: ai-action/setup-ollama@435e3afb7a5b950ac8868a114712baded7616c24 # v2.0.74

      - name: Pull Ollama Model
        # promptfoo自体はモデルの自動pullを行わないため、評価前に明示的に取得しておく。
        # 他のローカルAIワークフロー（local-ai-pr-description.yml等）と同一モデルを使用し、
        # 完全無料・リポジトリ内で完結する構成に統一する（Refs #573）。
        run: ollama pull qwen2.5-coder:0.5b

      - name: Run promptfoo evaluation
        # GitHub Models は2026年7月30日付で退役し 410 Gone を返すため、Ollama（ローカルLLM）へ移行済み（Refs #573）。
        # APIキー等のSecretsに依存しないため、フォークPRでも同一の評価結果が得られる。
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # promptfoo-action-v1.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompts: 'prompts/**/*.json'
          config: 'prompts/promptfooconfig.yaml'
          cache-path: ~/.cache/promptfoo
