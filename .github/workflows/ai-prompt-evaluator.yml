name: AI Prompt Evaluator

on:
  pull_request:
    paths:
      - 'prompts/**'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      models: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up promptfoo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/promptfoo
          key: ${{ runner.os }}-promptfoo-${{ hashFiles('prompts/**') }}
          restore-keys: |
            ${{ runner.os }}-promptfoo-

      - name: Run promptfoo evaluation
        # pull_request（pull_request_target ではない）トリガーのため、フォーク由来のPRには
        # GitHub Actions の仕組みにより GH_MODELS_TOKEN 等のSecretsは渡されない。
        # 同一リポジトリのブランチから作成されたPR（書き込み権限を持つ協力者のみ作成可能）でのみ
        # Secretsが利用可能であり、これは既存のリポジトリ書き込み権限と同等の信頼範囲である。
        # GH_MODELS_TOKEN は models: read のみを持つ fine-grained PAT に限定し、
        # 漏えい時の影響範囲を GitHub Models の利用に限定すること（権限要件は docs/security/ai-ci-tools.md 参照）。
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # promptfoo-action-v1.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompts: 'prompts/**/*.json'
          config: 'prompts/promptfooconfig.yaml'
          cache-path: ~/.cache/promptfoo
