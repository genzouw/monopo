name: AI Daily News Fetcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-post-news:
    name: Fetch AI News and Post Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-ddgs.txt
      - name: Run DDGS News Script
        id: ddgs_news
        run: |
          python3 scripts/ai-daily-news.py > news_results.txt
      - name: Post News to Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('news_results.txt', 'utf8');
            const { owner, repo } = context.repo;

            const match = results.match(/<ddgs-results>\n([\s\S]*?)\n<\/ddgs-results>/);
            if (!match) {
              console.log('ニュースが取得できませんでした。');
              return;
            }
            let data = [];
            try {
              data = JSON.parse(match[1]);
            } catch (e) {
              console.log('JSONパースエラー', e);
              return;
            }

            if (data.length === 0) {
              console.log('ニュースが0件でした。');
              return;
            }

            const clean = (s) =>
              String(s ?? '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 300)
                .replace(/[@#]/g, (c) => `${c}\u200b`)
                .replace(/[`<>\[\]\\]/g, (c) => `\\${c}`);
            const safeHref = (u) => {
              const href = String(u ?? '').trim();
              if (!/^https?:\/\//i.test(href)) return '';
              return href.replace(/[()\s<>]/g, (c) => encodeURIComponent(c));
            };
            const items = data
              .map((r) => ({ title: clean(r.title), url: safeHref(r.url), body: clean(r.body), source: clean(r.source) }))
              .filter((r) => r.url);

            if (items.length === 0) {
              console.log('有効なニュースが0件でした。');
              return;
            }

            const date = new Date().toISOString().split('T')[0];
            const title = `📰 AI Daily News - ${date}`;
            const body = [
              '## 🤖 今日のAI最新ニュース',
              '',
              '最新の生成AI関連ニュースをDuckDuckGoから取得しました。',
              '',
              ...items.map((r) => `- **[${r.title}](${r.url})** (${r.source})\n  > ${r.body}`),
              '',
              '<sub>※ このIssueは \`ai-daily-news.yml\` ワークフローにより自動生成されました。完全無料のAPIを利用しています。</sub>',
            ].join('\n');

            await github.rest.issues.create({ owner, repo, title, body, labels: ['ai-news'] });
