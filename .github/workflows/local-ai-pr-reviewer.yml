name: Local AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'

concurrency:
  group: local-ai-pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip Fork PR
        id: fork-check
        env:
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO_FULL_NAME" != "$BASE_REPO_FULL_NAME" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "::notice::フォークPRのため GITHUB_TOKEN が読み取り専用となり、レビューコメントの投稿ができません。このジョブをスキップします。"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Ollama
        if: steps.fork-check.outputs.is_fork != 'true'
        uses: ai-action/setup-ollama@435e3afb7a5b950ac8868a114712baded7616c24 # v2.0.74

      - name: Fetch PR Diff
        id: fetch-diff
        if: steps.fork-check.outputs.is_fork != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });
            return diff.data.slice(0, 5000);

      - name: Generate AI Code Review with Local Ollama
        id: generate-review
        if: steps.fork-check.outputs.is_fork != 'true'
        uses: $/.github/actions/ollama-generate
        with:
          prompt: |
            あなたは熟練のソフトウェアエンジニアです。以下のプルリクエストの差分をもとに、コードの品質、潜在的なバグ、セキュリティの問題について日本語で簡潔にフィードバックを提供してください。

            差分:
            ${{ steps.fetch-diff.outputs.result }}

      - name: Post AI Code Review
        if: steps.fork-check.outputs.is_fork != 'true' && steps.generate-review.outputs.content != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW: ${{ steps.generate-review.outputs.content }}
          MODEL: ${{ steps.generate-review.outputs.model }}
        with:
          script: |
            const review = process.env.REVIEW;
            const model = process.env.MODEL;
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 Local AI Code Review (Ollama - ${model})\n\n${review}`
              });
            } catch (error) {
              core.warning(`Failed to post review comment: ${error.message}`);
            }
