name: Open Code Review

# PRに対する完全無料のオープンソースAIコードレビュー（Open Code Review）を実行します。
# L1/L2モードにより、APIキー（外部LLM）なしで基本的な品質ゲートチェックを行います。

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Open Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c95a14d0e5bab51a9f56296a4eb0e416910cd350 # v2.10.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      # Open Code Review は API キーがなくても L1/L2 スキャン (TF-IDF 等) で PR をレビューします。
      - uses: raye-deng/open-code-review@9e572b5de038eaa1abff0c4af3c28c9008c21dab # v2.1.0
        with:
          sla: L1
          threshold: 70
          github-token: ${{ secrets.GITHUB_TOKEN }}
