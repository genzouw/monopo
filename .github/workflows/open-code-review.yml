name: Open Code Review

# PRに対する完全無料のオープンソースAIコードレビュー（Open Code Review）を実行します。
# L1/L2モードにより、APIキー（外部LLM）なしで基本的な品質ゲートチェックを行います。

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Open Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Open Code Review は API キーがなくても L1/L2 スキャン (TF-IDF 等) で PR をレビューします。
      - uses: raye-deng/open-code-review@2a4b12983c990e1498ca6c34d095bd54c128e53f # v2.1.0
        with:
          sla: L1
          threshold: 70
          github-token: ${{ secrets.GITHUB_TOKEN }}
