name: TruffleHog Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC) に再スキャン
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # リポジトリのソースコード読み取り用
  contents: read

jobs:
  trufflehog:
    name: Scan for active verified secrets
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴全体をスキャンするためフルクローン
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          # PR では base を空にして head のみ指定し、PR の head に至る全履歴を走査する。
          # 両方を空にすると action.yml が base.sha / head.sha を補完し、PR の差分スキャンになる。
          # PR 以外のイベントは両方空のまま action 既定の挙動（push は差分、schedule / workflow_dispatch は全履歴）とする。
          base: ''
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          # 実際に外部プロバイダに有効か検証できたシークレット（Active Verified）のみ検知する
          # Gitleaks のパターンマッチと役割を分けるため --only-verified を使用
          extra_args: --only-verified
