name: TruffleHog Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC) に再スキャン
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # リポジトリのソースコード読み取り用
  contents: read

jobs:
  trufflehog:
    name: Scan for active verified secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 履歴全体をスキャンするためフルクローン
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # 実際に外部プロバイダに有効か検証できたシークレット（Active Verified）のみ検知する
          # Gitleaks のパターンマッチと役割を分けるため --only-verified を使用
          extra_args: --only-verified
