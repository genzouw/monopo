name: detect-secrets Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: detect-secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0
      - name: Run detect-secrets
        run: |
          # 既存のベースラインを使用してチェック（フック動作）し、新規シークレットがあればエラーで落ちる
          # package.json 等は .pre-commit-config.yaml の detect-secrets フックと同じく除外する
          git ls-files -z \
            | grep -zvE '(^|/)(package\.json|bun\.lockb?|package-lock\.json)$' \
            | xargs -0 detect-secrets-hook --baseline .secrets.baseline
