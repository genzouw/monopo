name: AI Context Packing (Repomix)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-codebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14
      - name: Run Repomix
        run: |
          success=false
          for i in 1 2 3; do
            if bunx repomix@1.16.0 --style xml --output codebase.xml; then
              success=true
              break
            fi
            echo "Repomixの実行に失敗しました。リトライします... ($i/3)"
            sleep 10
          done
          if [ "$success" != true ]; then
            echo "Repomixの実行が3回失敗しました。npmレジストリの伝播遅延の可能性があります。" >&2
            exit 1
          fi
      - name: Upload Repomix output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebase
          path: codebase.xml
