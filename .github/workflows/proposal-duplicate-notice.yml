name: Proposal Duplicate Notice

# 提案ドキュメントが新規追加された PR に、Issue で起票する運用と正本 Issue (#159) への案内を自動コメントする。
# 警告のみでマージはブロックしない（コメント投稿に失敗してもジョブは成功させる）。

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notice:
    name: Notice duplicate proposals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # required to create/update the notice comment
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Comment existing proposals on new proposal files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const marker = '<!-- proposal-duplicate-notice -->';
            // 索引（docs/proposals/README.md）は提案ではないため数えない
            const isProposal = (path) =>
              path !== 'docs/proposals/README.md' &&
              (path.startsWith('docs/proposals/') || /^ISSUE_PROPOSAL_[^/]*\.md$/.test(path));

            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              const added = files
                .filter((f) => f.status === 'added' && isProposal(f.filename))
                .map((f) => f.filename);
              if (added.length === 0) {
                console.log('提案ドキュメントの新規追加なし。コメントしません。');
                return;
              }

              const base = `https://github.com/${owner}/${repo}`;
              const body = [
                marker,
                '## 提案ドキュメントは追加しない運用です',
                '',
                'このPRは提案ドキュメントを新規追加しています。',
                ...added.map((p) => `- \`${p}\``),
                '',
                '`docs/proposals/` には索引 `README.md` だけを置いており、`ISSUE_PROPOSAL_*.md` などの提案ドキュメントは #678 で削除しました。',
                '',
                '- **正本は #159 です。** 新規提案はファイルにせず、既存の Issue を確認したうえで Issue として起票するか、既存の Issue へコメントで足してください',
                `- 受け皿となる Issue の一覧: [docs/proposals/README.md](${base}/blob/${pull.base.ref}/docs/proposals/README.md)`,
                `- 運用ルール: [docs/ai-guidelines.md](${base}/blob/${pull.base.ref}/docs/ai-guidelines.md#機能提案の扱い-docsproposals-は索引のみ)`,
                '',
                '<sub>このコメントは警告のみで、マージはブロックされません。</sub>',
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull.number,
                per_page: 100,
              });
              const previous = comments.find((c) => c.body && c.body.includes(marker));
              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
                console.log(`既存コメント ${previous.id} を更新しました。`);
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
                console.log('コメントを投稿しました。');
              }
            } catch (error) {
              // fork PR で token が read-only の場合などでも CI を失敗させない
              core.warning(`重複確認コメントの投稿に失敗しました: ${error.message}`);
            }
