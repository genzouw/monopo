name: AI Weekly Tech News Digest

on:
  # GitHub Models が廃止プロセス（retirement brownout）に入り HTTP 410 を返すため、
  # 移行先が決まるまでスケジュール実行を停止する（詳細は Issue #539）。
  # 手動実行は workflow_dispatch から可能。復旧時は以下のコメントを解除すること。
  # schedule:
  #   - cron: '0 8 * * 3' # 毎週水曜日の午前8時（UTC）に実行
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch Tech News and Summarize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          script: | # pragma: allowlist secret
            const MAX_CHARS = 2000;
            const year = new Date().getFullYear();

            // Web Search via Tavily
            let searchData = { answer: '検索結果なし', results: [] };
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {}) },
                signal: AbortSignal.timeout(30000),
                body: JSON.stringify({
                  query: `${year} latest AI coding tools free open source github actions cicd`,
                  topic: 'news',
                  days: 7,
                  search_depth: 'basic',
                  include_answer: true,
                }),
              });

              if (tavilyRes.ok) {
                searchData = await tavilyRes.json();
              }
            } catch (e) {
              core.warning(`Tavily 検索に失敗しました: ${String(e)}`);
            }

            const searchContext = (searchData.answer || '').slice(0, MAX_CHARS) + '\n' + (searchData.results?.map(r => r.content).join('\n') || '').slice(0, MAX_CHARS);

            const prompt = `あなたはテックリードです。以下の検索結果を元に、新しいAIツールの導入や自動化に関する最新の有益なニュースとトレンドをまとめ、開発チーム向けのレポートを日本語で出力してください。
            特に、無料・オープンソースでGitHub Actionsに組み込めるツールに焦点を当ててください。
            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            検索結果:
            ${searchContext}`;

            let report;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              const aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                signal: AbortSignal.timeout(120000),
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],

                  max_tokens: 15000
                })
              });

              if (aiRes.ok) {
                const aiData = await aiRes.json();
                report = aiData.choices?.[0]?.message?.content || report;
              } else {
                const errBody = await aiRes.text().catch(() => '');
                core.warning(`AI テックニュースダイジェストの生成に失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              }
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
            }

            if (report) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 今週のAI・自動化トレンドダイジェスト (${new Date().toISOString().split('T')[0]})`,
                body: `### 🤖 Tech News Digest\n\n${report}`,
                labels: ['enhancement', 'ai-generated']
              });
            }
