name: AI Documentation Generator

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch PR Diff
        id: fetch-diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });
            const truncatedDiff = diff.data.slice(0, 10000);
            return truncatedDiff;

      - name: Generate and Commit Documentation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          PR_DIFF: ${{ steps.fetch-diff.outputs.result }}
        with:
          script: |
            const prNumber = context.issue.number;
            const prTitle = context.payload.pull_request.title;
            const prBody = (context.payload.pull_request.body || '').slice(0, 1000);
            const prDiff = process.env.PR_DIFF;

            // CLAUDE.md 最重要原則: 従量課金の検索API（Tavily）をCI/CDに組み込むことは禁止されているため、Web検索は無効化しています。
            const searchAnswer = '検索結果なし（Web検索はコスト方針により無効化されています）';

            const prompt = `あなたは優れたテクニカルライターであり、ソフトウェアエンジニアです。
            以下のマージされたPull Requestの情報、差分、および最新のWeb検索ベストプラクティスをもとに、
            このPRによる変更内容を詳細に記録するMarkdownドキュメントを日本語で作成してください。

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            PRタイトル: ${prTitle}
            PR本文: ${prBody}
            差分:
            ${prDiff}

            Web検索結果（ドキュメント作成のベストプラクティス）: ${searchAnswer}

            出力形式:
            ファイル全体の内容のみを出力してください。Markdownのコードブロック（\`\`\`markdown など）で囲まないでください。
            内容はタイトル（# PR-${prNumber}: ${prTitle}）、概要、変更の詳細、およびシステムへの影響（アーキテクチャや依存関係）を含めること。
            `;

            let generatedDoc = null;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              const aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                signal: AbortSignal.timeout(120000),
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 15000
                })
              });

              if (aiRes.ok) {
                const aiData = await aiRes.json();
                generatedDoc = aiData.choices?.[0]?.message?.content;
              } else {
                const errBody = await aiRes.text().catch(() => '');
                core.warning(`AI ドキュメント生成に失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              }
            } catch (e) {
              core.warning(`GitHub Models へのリクエストに失敗しました: ${String(e)}`);
            }

            if (generatedDoc) {
              const path = `docs/auto-generated/PR-${prNumber}.md`;
              const message = `docs(ai): 🤖 PR-${prNumber} の自動生成ドキュメントを追加`;
              const content = Buffer.from(generatedDoc).toString('base64');

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: path,
                message: message,
                content: content,
                branch: 'main'
              });
            } else {
              core.warning('ドキュメントの生成に失敗しました。');
            }
