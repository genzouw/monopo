name: Default Permissions Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日に実行

permissions:
  contents: read

jobs:
  audit-permissions:
    name: Audit Workflow Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Audit workflow top-level permissions (missing / excessive)
        run: |
          echo "🔍 Scanning workflows for missing or excessive top-level permissions..."

          # 1. 権限が明示されていないワークフローのチェック
          WORKFLOWS=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \))
          MISSING=$(echo "$WORKFLOWS" | xargs grep -EL '^permissions:' || true)
          if [ -n "$MISSING" ]; then
            echo "::error::❌ The following workflows do not have explicit top-level permissions set:"
            echo "$MISSING"
            echo "To enforce least privilege, all workflows must have explicit top-level 'permissions'."
            false
          else
            echo "✅ All workflows have explicit top-level permissions."
          fi

          # 2. トップレベルで write や read-all が指定されているワークフローのチェック
          EXCESSIVE=$(echo "$WORKFLOWS" | xargs awk 'FNR==1 { in_perms=0 } /^permissions: *((read|write)-all|\{.*(write|all))/ { print FILENAME; next } /^permissions:/ { in_perms=1; next } in_perms && /^  [a-z-]+: (write|all)/ { print FILENAME; in_perms=0 } in_perms && /^[^ ]/ { in_perms=0 }' || true)
          if [ -n "$EXCESSIVE" ]; then
            echo "::error::❌ The following workflows have excessive top-level permissions (write or read-all):"
            echo "$EXCESSIVE"
            echo "To enforce least privilege, top-level permissions must be read-only (e.g., contents: read). Move write permissions to specific jobs."
            false
          else
            echo "✅ All workflows follow least privilege for top-level permissions."
          fi

      - name: Audit workflow pull_request_target trigger
        run: |
          echo "🔍 Scanning workflows for pull_request_target trigger..."

          WORKFLOWS=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \))
          # マップ形式（on:\n  pull_request_target:）、スカラー形式（on: pull_request_target）、
          # インラインリスト形式（on: [push, pull_request_target]）、
          # ブロックリスト形式（on:\n  - pull_request_target）のすべてを検出する。
          PR_TARGET=$(echo "$WORKFLOWS" | xargs grep -El '^[[:space:]]*pull_request_target:|^[[:space:]]*on:[[:space:]]*pull_request_target[[:space:]]*$|^[[:space:]]*-[[:space:]]*pull_request_target[[:space:]]*$|^[[:space:]]*on:[[:space:]]*\[.*pull_request_target.*\]' || true)
          if [ -n "$PR_TARGET" ]; then
            echo "::error::❌ The following workflows use the prohibited 'pull_request_target' trigger:"
            echo "$PR_TARGET"
            echo "To prevent secrets leakage from forked PRs, 'pull_request_target' is strictly prohibited. Please use 'pull_request' instead."
            false
          else
            echo "✅ No workflows use the 'pull_request_target' trigger."
          fi
