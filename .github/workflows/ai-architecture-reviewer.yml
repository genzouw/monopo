name: AI Architecture Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  review-architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14

      - name: Bundle Codebase Context with Repomix
        run: bunx repomix@1.16.0 --style xml --output codebase.xml

      - name: Fetch PR Diff
        id: fetch-diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          result-encoding: string
          script: |
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });
            return diff.data.slice(0, 10000);

      - name: Perform Architecture Review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PR_DIFF: ${{ steps.fetch-diff.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;
            const title = context.payload.pull_request.title;
            const prDiff = process.env.PR_DIFF;

            let codebase = '<empty>';
            try {
              codebase = fs.readFileSync('codebase.xml', 'utf8').slice(0, 15000);
            } catch (e) {
              console.log('Repomix output not found.');
            }

            let searchAnswer = '検索結果なし';
            try {
              const tavilyRes = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                signal: AbortSignal.timeout(30000),
                headers: { 'Content-Type': 'application/json', ...(process.env.TAVILY_API_KEY ? { 'Authorization': `Bearer ${process.env.TAVILY_API_KEY}` } : {}) },
                body: JSON.stringify({
                  query: `2025 latest software architecture design patterns best practices scalability for: ${title}`,
                  search_depth: 'basic',
                  include_answer: true,
                }),
              });

              if (tavilyRes.ok) {
                const searchData = await tavilyRes.json();
                searchAnswer = (searchData.answer || '要約なし').slice(0, 1000);
              }
            } catch (e) {
              core.warning(`Tavily 検索に失敗しました: ${String(e)}`);
            }

            const prompt = `あなたはソフトウェアアーキテクチャの専門家です。
            以下のPRの差分、プロジェクトのコードベース全体（Repomixによる）、および最新のWeb検索のベストプラクティスをもとに、
            この変更がシステムの全体的なアーキテクチャ、スケーラビリティ、保守性、および設計パターンにどのような影響を与えるか、日本語でレビューしてください。

            プロジェクト要件:
            - 名称には「monopoly」ではなく必ず「monopo」を使用する。
            - パッケージマネージャには必ずBunを使用する。

            Web検索結果: ${searchAnswer}

            コードベース概要 (XML):
            ${codebase}

            差分:
            ${prDiff}`;

            let analysis = null;
            try {
              // GH_MODELS_TOKEN 未設定時は API を叩かずに中断し、Actions の注釈で検知できるようにする
              if (!process.env.GH_MODELS_TOKEN) {
                throw new Error('GH_MODELS_TOKEN が未設定です。リポジトリの Secrets に GH_MODELS_TOKEN を登録してください。');
              }
              const aiRes = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                signal: AbortSignal.timeout(120000),
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_MODELS_TOKEN}`
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_completion_tokens: 15000
                })
              });

              if (aiRes.ok) {
                const aiData = await aiRes.json();
                analysis = aiData.choices?.[0]?.message?.content;
                if (!analysis) {
                  // content 空は推論トークンが max_completion_tokens を使い切ったサイン。
                  core.warning(`GitHub Models から分析結果が返されませんでした。${JSON.stringify(aiData).slice(0, 500)}`);
                }
              } else {
                const errBody = await aiRes.text().catch(() => '');
                core.warning(`AI アーキテクチャレビューに失敗しました: HTTP ${aiRes.status} ${aiRes.statusText} ${errBody.slice(0, 500)}`);
              }
            } catch (e) {
              core.warning(`AI 推論に失敗しました: ${String(e)}`);
            }

            if (analysis) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 AI Architecture Review\n\n${analysis}`
              });
            }
