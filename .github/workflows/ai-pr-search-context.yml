name: AI PR Search Context

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PR 由来のコードと依存パッケージを実行するため、書き込み権限を持たせない
  search:
    name: Search AI Context for PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-ddgs.txt
      - name: Run DDGS Search Script
        id: ddgs_search
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          QUERY="${PR_TITLE} generative AI CI/CD trends open source completely free API GitHub Actions 2024 2025"
          python3 scripts/ai-pr-context-search.py --query "$QUERY" > search_results.txt
      - name: Upload search results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddgs-search-results
          path: search_results.txt
          retention-days: 1

  # 信頼済みの定義のみを実行し、PR のコードはチェックアウトしない。
  # fork からの PR は pull_request では読み取り専用トークンになるため対象外とする
  post-comment:
    name: Post Search Context to PR
    needs: search
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download search results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ddgs-search-results
      - name: Post Search Results to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('search_results.txt', 'utf8');
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const marker = '<!-- ai-pr-search-context -->';

            const match = results.match(/<ddgs-results>\n([\s\S]*?)\n<\/ddgs-results>/);
            if (!match) {
              console.log('検索結果が取得できませんでした。');
              return;
            }
            let data = [];
            try {
              data = JSON.parse(match[1]);
            } catch (e) {
              console.log('JSONパースエラー', e);
              return;
            }

            if (data.length === 0) {
              console.log('検索結果が0件でした。');
              return;
            }

            // 検索結果は第三者コンテンツのため、整形前に正規化する。
            // 改行を畳んで引用の途切れを防ぎ、メンション・Issue 参照を無効化し、
            // Markdown/HTML の記法を打ち消す。ゼロ幅スペース (U+200B) を挟むことで通知と自動リンクを防ぐ
            const clean = (s) =>
              String(s ?? '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 300)
                .replace(/[@#]/g, (c) => `${c}\u200b`)
                .replace(/[`<>\[\]\\]/g, (c) => `\\${c}`);
            // http(s) 以外のスキーム (javascript: 等) は除外し、括弧は URL エンコードしてリンク記法の崩れを防ぐ
            const safeHref = (u) => {
              const href = String(u ?? '').trim();
              if (!/^https?:\/\//i.test(href)) return '';
              return href.replace(/[()\s<>]/g, (c) => encodeURIComponent(c));
            };
            const items = data
              .map((r) => ({ title: clean(r.title), href: safeHref(r.href), body: clean(r.body) }))
              .filter((r) => r.href);

            if (items.length === 0) {
              console.log('有効な検索結果が0件でした。');
              return;
            }

            const body = [
              marker,
              '## 🤖 AI Search Context Gathering',
              '',
              'このPRに関する参考情報を最新のウェブ検索（DuckDuckGo）から取得しました。AIによるレビューや実装の参考にしてください。',
              '',
              ...items.map((r) => `- **[${r.title}](${r.href})**\n  > ${r.body}`),
              '',
              '<sub>※ このコメントは `ai-pr-search-context.yml` ワークフローにより自動生成されました。完全無料のAPIを利用しています。</sub>',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const previous = comments.find(
              (c) => c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
