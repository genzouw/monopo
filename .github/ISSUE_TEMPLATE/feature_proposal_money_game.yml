name: '💡 新機能提案（マネーゲーム・教育的機能）'
description: '現実社会を模倣した革新的なマネーゲーム機能の追加提案'
title: '【提案】monopo への現実的・教育的マネーゲーム機能の追加: <機能の簡単な説明>'
labels: ['enhancement', 'proposal', 'game-design', 'game-mechanics']
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 機能提案の背景
        「monopo（モノポ）」を現実の経済の動きやマネーゲームの概念を学習できる「教育的教材」として進化させるための提案フォーマットです。
        従来の「伝統的な不動産取引ゲーム」や「伝統的な資産運用ボードゲーム」の枠を超え、現代資本主義の複雑なシステムをシミュレートする機能を提案してください。

  - type: textarea
    id: feature_description
    attributes:
      label: '🎯 提案する機能の概要 (What)'
      description: 'どのような機能を追加したいですか？（例：空売り、CBDC、インサイダー取引、タックスヘイブンなど）'
      placeholder: '例：特定のエリアの暴落を見越して「空売り」を仕掛ける機能を導入したい。'
    validations:
      required: true

  - type: textarea
    id: mechanics
    attributes:
      label: '⚙️ ゲーム内での具体的なメカニクス (How)'
      description: 'この機能はゲーム内でどのように動作しますか？既存のシステム（エリア独占、株式相乗り、増資など）との連動があれば記載してください。'
      placeholder: |
        - プレイヤーは株価の〇%を証拠金として支払い、空売りポジションを持てる。
        - エリアの価値が下がれば差額が利益になるが、上がった場合は追加で現金を支払う（追証）必要がある。
        - 既存の「強制買収」や「増資」による株価上昇と組み合わせることで、踏み上げ（ショートスクイーズ）のリスクが生じる。
    validations:
      required: true

  - type: textarea
    id: educational_value
    attributes:
      label: '🎓 教材としての教育的効果 (Why it is educational)'
      description: 'この機能を通じて、プレイヤーは現実のどのような経済システムやリスクを学べますか？'
      placeholder: '空売りの無限損失リスク（踏み上げ）や、ヘッジ（リスク回避）の重要性を実践的に学べる。'
    validations:
      required: true

  - type: textarea
    id: balance_impact
    attributes:
      label: '⚖️ ゲームバランスへの影響と懸念点'
      description: 'この機能を追加することで懸念されるゲームバランスの崩れや、複雑になりすぎる点があれば記載してください。'
      placeholder: '初心者が空売りリスクを理解せずに破産する可能性が高まるため、初期状態では機能ロックするか、チュートリアルが必要。'
    validations:
      required: false
