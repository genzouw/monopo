name: Ollama Generate
description: >-
  ローカル Ollama (デフォルト: deepseek-r1:1.5b) にプロンプトを送信し、生成結果を返す。
  モデルの pull・生成リクエスト・タイムアウト・エラーハンドリングを一箇所に集約し、
  呼び出し側ワークフロー間での実装差分（ログ書式のばらつき等）を防ぐ。
  呼び出し側で事前に actions/checkout と ai-action/setup-ollama を実行しておくこと。

inputs:
  prompt:
    description: Ollama に渡すプロンプト
    required: true
  model:
    description: 使用する Ollama モデル
    required: false
    default: 'deepseek-r1:1.5b'

outputs:
  content:
    description: 生成結果。取得に失敗した場合は空文字列。
    value: ${{ steps.generate.outputs.result }}
  model:
    description: 実際に使用したOllamaモデル名。呼び出し側の表示文字列をこのactionのデフォルト値と同期させるために使用する。
    value: ${{ inputs.model }}

runs:
  using: composite
  steps:
    - name: Call Ollama
      id: generate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        OLLAMA_PROMPT: ${{ inputs.prompt }}
        OLLAMA_MODEL: ${{ inputs.model }}
      with:
        result-encoding: string
        script: |
          const prompt = process.env.OLLAMA_PROMPT;
          const model = process.env.OLLAMA_MODEL;

          let content = '';
          try {
            const pullResponse = await fetch('http://localhost:11434/api/pull', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model,
                stream: false
              }),
              // pull 180 秒 + generate 180 秒の最悪 6 分を、呼び出し元ジョブの timeout-minutes: 10 に収める。
              signal: AbortSignal.timeout(180_000)
            });
            if (!pullResponse.ok) {
              core.warning(`Failed to pull model ${model} with local Ollama. Status: ${pullResponse.status}`);
            }

            const response = await fetch('http://localhost:11434/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model,
                prompt,
                stream: false,
                // 推論モデル（deepseek-r1 等）の思考過程を response に混ぜない（対応バージョンのみ有効）。
                think: false
              }),
              // 推論モデルは CPU のみの Runner で応答に時間がかかるため、余裕を持たせる。
              signal: AbortSignal.timeout(180_000)
            });

            if (response.ok) {
              const data = await response.json();
              // think: false が効かない Ollama バージョン向けに、<think>...</think> を除去する。
              content = (data.response ?? '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
              if (content === '') {
                core.warning(`Ollama returned an empty response for model ${model}. Downstream steps will be skipped.`);
              }
            } else {
              core.warning(`Failed to generate content with local Ollama. Status: ${response.status}`);
            }
          } catch (error) {
            core.warning(`Failed to communicate with local Ollama (timeout, connection, or JSON parse error): ${error.message}`);
          }

          return content;
